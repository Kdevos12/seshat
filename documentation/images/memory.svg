<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 600" width="1090" height="600" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Memory: the journal is the only source of truth</title><defs><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4256"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#3a4256"/></marker></defs>
<rect x="0.5" y="0.5" width="1089" height="599" rx="6" fill="#ffffff" stroke="#d0d5df"/>
<text x="20" y="30" font-size="18" font-weight="700" text-anchor="start" fill="#1b2230">Memory: the journal is the only source of truth</text>
<text x="20" y="52" font-size="13" text-anchor="start" fill="#4a5163">Everything else (tables, indexes, graphs, reports) is a projection that can be rebuilt from the journal.</text>
<rect x="20" y="75" width="290" height="70" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="165.0" y="97.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">Orchestrator, provers, tools</text>
<text x="165.0" y="114.5" font-size="13" text-anchor="middle" fill="#1b2230">tasks, sessions, checks, tool runs,</text>
<text x="165.0" y="131.5" font-size="13" text-anchor="middle" fill="#1b2230">charges: one event each</text>
<rect x="20" y="160" width="290" height="70" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="165.0" y="182.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">Lines</text>
<text x="165.0" y="199.5" font-size="13" text-anchor="middle" fill="#1b2230">write through a view of the store</text>
<text x="165.0" y="216.5" font-size="13" text-anchor="middle" fill="#1b2230">that stamps their name (`line:M1`)</text>
<rect x="20" y="245" width="290" height="70" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="165.0" y="267.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">The research team</text>
<text x="165.0" y="284.5" font-size="13" text-anchor="middle" fill="#1b2230">hints, signatures, steers, as</text>
<text x="165.0" y="301.5" font-size="13" text-anchor="middle" fill="#1b2230">`human:NAME`; they change no status</text>
<rect x="370" y="100" width="320" height="130" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="530.0" y="135.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">Event journal (@seshat/core)</text>
<text x="530.0" y="152.5" font-size="13" text-anchor="middle" fill="#1b2230">JSONL, one event a line, each with the</text>
<text x="530.0" y="169.5" font-size="13" text-anchor="middle" fill="#1b2230">hash of the one before; blobs for large</text>
<text x="530.0" y="186.5" font-size="13" text-anchor="middle" fill="#1b2230">contents; every event checked against</text>
<text x="530.0" y="203.5" font-size="13" text-anchor="middle" fill="#1b2230">the invariants before it is written</text>
<rect x="370" y="265" width="320" height="80" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="530.0" y="284.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">Resume and carry-over</text>
<text x="530.0" y="301.0" font-size="13" text-anchor="middle" fill="#1b2230">a run whose process ended continues</text>
<text x="530.0" y="318.0" font-size="13" text-anchor="middle" fill="#1b2230">from its journal alone; `--memory-from`</text>
<text x="530.0" y="335.0" font-size="13" text-anchor="middle" fill="#1b2230">takes an earlier journal by its last hash</text>
<rect x="750" y="75" width="290" height="70" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="895.0" y="97.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">SQLite projection</text>
<text x="895.0" y="114.5" font-size="13" text-anchor="middle" fill="#1b2230">claims, edges, nodes, tasks:</text>
<text x="895.0" y="131.5" font-size="13" text-anchor="middle" fill="#1b2230">rebuilt from the journal</text>
<rect x="750" y="160" width="290" height="70" rx="6" fill="#fbf1e1" stroke="#a66300" stroke-width="2"/>
<text x="895.0" y="182.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">Indexes</text>
<text x="895.0" y="199.5" font-size="13" text-anchor="middle" fill="#1b2230">BM25 library index (M3), graph labels</text>
<text x="895.0" y="216.5" font-size="13" text-anchor="middle" fill="#1b2230">and PageRank (M2)</text>
<rect x="750" y="245" width="290" height="70" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="895.0" y="267.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">Readers, no model</text>
<text x="895.0" y="284.5" font-size="13" text-anchor="middle" fill="#1b2230">RESULT.md, view.html,</text>
<text x="895.0" y="301.5" font-size="13" text-anchor="middle" fill="#1b2230">`harness audit`, `harness ui`</text>
<polyline points="310,110 340,110" fill="none" stroke="#3a4256" stroke-width="1.8"/>
<polyline points="310,195 340,195" fill="none" stroke="#3a4256" stroke-width="1.8"/>
<polyline points="310,280 340,280" fill="none" stroke="#3a4256" stroke-width="1.8"/>
<polyline points="340,110 340,280" fill="none" stroke="#3a4256" stroke-width="1.8"/>
<polyline points="340,165 370,165" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)"/>
<polyline points="690,165 720,165" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)"/>
<polyline points="720,110 720,280" fill="none" stroke="#3a4256" stroke-width="1.8"/>
<polyline points="720,110 750,110" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)"/>
<polyline points="720,195 750,195" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)"/>
<polyline points="720,280 750,280" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)"/>
<polyline points="530,230 530,265" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)"/>
<rect x="20" y="375" width="1020" height="48" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="530.0" y="395.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">MemoryStore: the one interface lines read and write</text>
<text x="530.0" y="412.0" font-size="13" text-anchor="middle" fill="#1b2230">reads come from the projection; every write is an event in the journal</text>
<polyline points="1040,110 1056,110 1056,399 1040,399" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)"/>
<rect x="20" y="470" width="250" height="84" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="145.0" y="491.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">M1: claims, negative memory</text>
<text x="145.0" y="508.0" font-size="13" text-anchor="middle" fill="#1b2230">one claim per statement; the</text>
<text x="145.0" y="525.0" font-size="13" text-anchor="middle" fill="#1b2230">'already tried' list: strategies</text>
<text x="145.0" y="542.0" font-size="13" text-anchor="middle" fill="#1b2230">and how each one failed</text>
<rect x="286" y="470" width="250" height="84" rx="6" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="411.0" y="499.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">M2: the variant graph</text>
<text x="411.0" y="516.5" font-size="13" text-anchor="middle" fill="#1b2230">variants, edges checked by Lean,</text>
<text x="411.0" y="533.5" font-size="13" text-anchor="middle" fill="#1b2230">propagation, the twin</text>
<rect x="552" y="470" width="250" height="84" rx="6" fill="#fbf1e1" stroke="#a66300" stroke-width="2"/>
<text x="677.0" y="491.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">M5: lessons</text>
<text x="677.0" y="508.0" font-size="13" text-anchor="middle" fill="#1b2230">learned from accepted proofs</text>
<text x="677.0" y="525.0" font-size="13" text-anchor="middle" fill="#1b2230">and recurring failures; off when</text>
<text x="677.0" y="542.0" font-size="13" text-anchor="middle" fill="#1b2230">their effect is negative</text>
<rect x="818" y="470" width="250" height="84" rx="6" fill="#fbf1e1" stroke="#a66300" stroke-width="2"/>
<text x="943.0" y="491.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2230">M3: the lemma library</text>
<text x="943.0" y="508.0" font-size="13" text-anchor="middle" fill="#1b2230">promoted auxiliary lemmas,</text>
<text x="943.0" y="525.0" font-size="13" text-anchor="middle" fill="#1b2230">found again by BM25 search</text>
<text x="943.0" y="542.0" font-size="13" text-anchor="middle" fill="#1b2230">and `library_search`</text>
<polyline points="145,470 145,423" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)" marker-start="url(#ae)"/>
<polyline points="411,470 411,423" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)" marker-start="url(#ae)"/>
<polyline points="677,470 677,423" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)" marker-start="url(#ae)"/>
<polyline points="943,470 943,423" fill="none" stroke="#3a4256" stroke-width="1.8" marker-end="url(#ae)" marker-start="url(#ae)"/>
<rect x="20" y="572" width="22" height="14" rx="3" fill="#e8eefa" stroke="#1f4fa3" stroke-width="2"/>
<text x="48" y="584" font-size="12" text-anchor="start" fill="#1b2230">built; run for real, or needs neither Lean nor a model</text>
<rect x="444.6" y="572" width="22" height="14" rx="3" fill="#fbf1e1" stroke="#a66300" stroke-width="2"/>
<text x="472.6" y="584" font-size="12" text-anchor="start" fill="#1b2230">built; simulations only</text>
</svg>
