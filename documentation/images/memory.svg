<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">Memory: one interface over the journal</title>
<defs><marker id="ah-2e7448" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#2e7448"/></marker><marker id="ah-3b4456" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#3b4456"/></marker><marker id="ah-8b94a5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#8b94a5"/></marker><marker id="ah-a87414" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#a87414"/></marker></defs>
<rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">Memory: one interface over the journal</text>
<text x="24" y="52" font-size="12" fill="#5b6475">Lines read and write claims, edges and nodes only through the store; unverified records are stamped, drawn at random and judged by effect.</text>
<rect x="24" y="76" width="952" height="144" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(a) ONE INTERFACE: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">MEMORYSTORE</tspan></text>
<rect x="24" y="232" width="952" height="196" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="250" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(b) WHAT IT HOLDS</text>
<rect x="24" y="440" width="466" height="176" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="458" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(c) PROVENANCE AND EPOCHS</text>
<rect x="506" y="440" width="470" height="176" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="518" y="458" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(d) RANDOMIZED INCLUSION</text>
<rect x="24" y="628" width="952" height="122" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="646" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(e) MEMORY ACROSS RUNS: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--MEMORY-FROM</tspan>, PINNED BY THE EARLIER JOURNAL'S LAST HASH</text>
<rect x="36" y="104" width="190" height="92" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="80.5" y="134.1" font-size="11.5" fill="#2b3340" font-weight="700">Lines, orchestrator</text>
<text x="131" y="148.5" font-size="10.5" fill="#1f2633" text-anchor="middle">a line gets a view:</text>
<text x="131" y="162.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">withActor(&quot;line:M1&quot;)</tspan>;</text>
<text x="131" y="175.8" font-size="10.5" fill="#1f2633" text-anchor="middle">none holds the journal</text>
<rect x="266" y="104" width="260" height="92" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="2.4" />
<text x="358.1" y="134.1" font-size="11.5" fill="#6b4a0c" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">MemoryStore</tspan></text>
<text x="396" y="148.5" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">ensureClaim</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">addEdge</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">recordNode</tspan>,</text>
<text x="396" y="162.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">updateNode</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">retractClaim</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">draw</tspan>;</text>
<text x="396" y="175.8" font-size="10.5" fill="#1f2633" text-anchor="middle">reads: claims, edges, nodes, attempts</text>
<rect x="566" y="104" width="170" height="92" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<g transform="translate(620,121.2) scale(0.8)" fill="none" stroke="#a87414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="10" cy="4.5" rx="7" ry="2.5"/><path d="M3 4.5v11c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-11"/><path d="M3 10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></g>
<text x="642" y="134.1" font-size="11.5" fill="#6b4a0c" font-weight="700">Journal</text>
<text x="651" y="148.5" font-size="10.5" fill="#1f2633" text-anchor="middle">one event per write,</text>
<text x="651" y="162.2" font-size="10.5" fill="#1f2633" text-anchor="middle">invariants checked</text>
<text x="651" y="175.8" font-size="10.5" fill="#1f2633" text-anchor="middle">before it is appended</text>
<rect x="776" y="104" width="188" height="92" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<text x="811.4" y="140.9" font-size="11.5" fill="#6b4a0c" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">projection.sqlite</tspan></text>
<text x="870" y="155.4" font-size="10.5" fill="#1f2633" text-anchor="middle">rebuilt from the journal;</text>
<text x="870" y="169" font-size="10.5" fill="#1f2633" text-anchor="middle">every read comes from it</text>
<path d="M226,150 L266,150" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)" marker-start="url(#ah-3b4456)"/>
<path d="M526,150 L566,150" fill="none" stroke="#a87414" stroke-width="1.4" marker-end="url(#ah-a87414)"/>
<path d="M736,150 L776,150" fill="none" stroke="#a87414" stroke-width="1.4" marker-end="url(#ah-a87414)"/>
<path d="M870,196 L870,202 Q870,208 864,208 L402,208 Q396,208 396,202 L396,196" fill="none" stroke="#a87414" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-a87414)"/>
<rect x="48" y="266" width="220" height="52" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="121.4" y="289.8" font-size="11.5" fill="#1d4a2e" font-weight="700">claim <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">proved</tspan></text>
<text x="158" y="304.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">(n : ℕ) : n + 0 = n</tspan></text>
<rect x="48" y="366" width="220" height="52" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="128.3" y="389.8" font-size="11.5" fill="#2b3340" font-weight="700">claim <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">open</tspan></text>
<text x="158" y="404.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">: 0 + 0 = 0</tspan>, a variant</text>
<path d="M213,366 L213,318" fill="none" stroke="#2e7448" stroke-width="1.4" marker-end="url(#ah-2e7448)"/>
<rect x="224" y="332" width="88" height="19" rx="9.5" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.2" />
<text x="268" y="345.1" font-size="10" fill="#1d4a2e" text-anchor="middle" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">lean_checked</tspan></text>
<rect x="336" y="266" width="232" height="52" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="416.1" y="289.8" font-size="11.5" fill="#2b3340" font-weight="700">node <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">lesson</tspan></text>
<text x="452" y="304.2" font-size="10.5" fill="#1f2633" text-anchor="middle">about the claim; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">learned</tspan>, stamped</text>
<rect x="336" y="366" width="232" height="52" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="398.8" y="389.8" font-size="11.5" fill="#2b3340" font-weight="700">node <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">fingerprint</tspan></text>
<text x="452" y="404.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">data</tspan>: JSON; large parts in blobs</text>
<path d="M336,292 L268,292" fill="none" stroke="#8b94a5" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-8b94a5)"/>
<path d="M336,392 L268,392" fill="none" stroke="#8b94a5" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-8b94a5)"/>
<rect x="36" y="468" width="216" height="136" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="89.8" y="506.5" font-size="11.5" fill="#2b3340" font-weight="700">Unverified: stamped</text>
<text x="144" y="520.9" font-size="10.5" fill="#1f2633" text-anchor="middle">lesson, attempt record,</text>
<text x="144" y="534.6" font-size="10.5" fill="#1f2633" text-anchor="middle">posterior, learned node:</text>
<text x="144" y="548.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">modelId</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">promptVersion</tspan>,</text>
<text x="144" y="561.9" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">mathlibRev</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">harnessVersion</tspan>,</text>
<text x="144" y="575.5" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">budgetClass</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">createdAt</tspan></text>
<rect x="264" y="468" width="214" height="48" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="324" y="489.9" font-size="11" fill="#1d4a2e" font-weight="700">Verified: no stamp</text>
<text x="371" y="503.7" font-size="10" fill="#1f2633" text-anchor="middle">proved claim, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">lean_checked</tspan> edge</text>
<rect x="264" y="528" width="214" height="76" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="311.7" y="550.1" font-size="11.5" fill="#2b3340" font-weight="700">New epoch: probation</text>
<text x="371" y="564.6" font-size="10.5" fill="#1f2633" text-anchor="middle">model family, prompt major or</text>
<text x="371" y="578.2" font-size="10.5" fill="#1f2633" text-anchor="middle">Mathlib revision changes: old</text>
<text x="371" y="591.9" font-size="10.5" fill="#1f2633" text-anchor="middle">counters shrink, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">k</tspan> = 0.25</text>
<rect x="518" y="466" width="128" height="78" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="535" y="489.9" font-size="11" fill="#2b3340" font-weight="700">Items a line chose</text>
<text x="582" y="503.7" font-size="10" fill="#1f2633" text-anchor="middle">claims and verified</text>
<text x="582" y="516.7" font-size="10" fill="#1f2633" text-anchor="middle">facts are never drawn,</text>
<text x="582" y="529.7" font-size="10" fill="#1f2633" text-anchor="middle">always shown</text>
<rect x="670" y="466" width="136" height="78" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<text x="702.4" y="489.9" font-size="11" fill="#6b4a0c" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">draw</tspan>, seeded</text>
<text x="738" y="503.7" font-size="10" fill="#1f2633" text-anchor="middle">in with <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">pNew</tspan> 0.5,</text>
<text x="738" y="516.7" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">p</tspan> 0.9 after 20 uses</text>
<text x="738" y="529.7" font-size="10" fill="#1f2633" text-anchor="middle">in the epoch</text>
<rect x="834" y="466" width="130" height="36" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="857.2" y="488.4" font-size="11" fill="#1d4a2e" font-weight="700">included: shown</text>
<rect x="834" y="508" width="130" height="36" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="877.6" y="530.4" font-size="11" fill="#2b3340" font-weight="700">withheld</text>
<path d="M646,505 L670,505" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M806,489.4 L834,484" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M806,520.6 L834,526" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="518" y="564" width="446" height="42" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="741" y="582.9" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-weight="700">effect</tspan> = success rate with the item vs without, two Beta posteriors;</text>
<text x="741" y="596.5" font-size="10.5" fill="#1f2633" text-anchor="middle">deactivate when P(effect &lt; 0) &gt; 0.9 after enough observations</text>
<path d="M899,544 L899,564" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="36" y="656" width="300" height="84" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="84" y="688.9" font-size="11.5" fill="#1d4a2e" font-weight="700">Same Lean environment (equal hash)</text>
<text x="186" y="703.4" font-size="10.5" fill="#1f2633" text-anchor="middle">claims keep their status, validations</text>
<text x="186" y="717" font-size="10.5" fill="#1f2633" text-anchor="middle">count, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lean_checked</tspan> edges propagate</text>
<rect x="352" y="656" width="300" height="84" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="412.2" y="682.1" font-size="11.5" fill="#2b3340" font-weight="700">Another or unknown environment</text>
<text x="502" y="696.6" font-size="10.5" fill="#1f2633" text-anchor="middle">claims <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">open</tspan>, edges <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">proposed</tspan>; the old</text>
<text x="502" y="710.2" font-size="10.5" fill="#1f2633" text-anchor="middle">status stays as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">earlierStatus</tspan>; prove</text>
<text x="502" y="723.9" font-size="10.5" fill="#1f2633" text-anchor="middle">again through <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">validate</tspan></text>
<rect x="668" y="656" width="296" height="84" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="787.5" y="682.1" font-size="11.5" fill="#2b3340" font-weight="700">Either way</text>
<text x="816" y="696.6" font-size="10.5" fill="#1f2633" text-anchor="middle">attempts, lessons, nodes carry as memory,</text>
<text x="816" y="710.2" font-size="10.5" fill="#1f2633" text-anchor="middle">stamped and unverified; a problem's outcome,</text>
<text x="816" y="723.9" font-size="10.5" fill="#1f2633" text-anchor="middle">tasks and spend do not carry</text>
<text x="640" y="211.7" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">reads</text>
<text x="205" y="346" font-size="10" fill="#5b6475" text-anchor="end"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">special_case_of</tspan></text>
<text x="302" y="287.7" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">claimId</tspan></text>
<text x="302" y="387.7" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">claimId</tspan></text>
<text x="612" y="262" font-size="10.5" fill="#1f2633"><tspan font-weight="700">Claims</tspan>: one per statement id, a hash of the statement and its</text>
<text x="612" y="276" font-size="10.5" fill="#1f2633">header (same hash, same claim); a status that only Lean raises.</text>
<text x="612" y="308" font-size="10.5" fill="#1f2633"><tspan font-weight="700">Edges</tspan>: 11 kinds (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">implies</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">equiv</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">special_case_of</tspan>...);</text>
<text x="612" y="322" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">proposed</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">computed</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">informal_checked</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">human_signed</tspan>,</text>
<text x="612" y="336" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lean_checked</tspan>: only the last propagates proofs.</text>
<text x="612" y="368" font-size="10.5" fill="#1f2633"><tspan font-weight="700">Nodes</tspan>: any lowercase kind (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lemma</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lesson</tspan>...); the package</text>
<text x="612" y="382" font-size="10.5" fill="#1f2633">that owns a kind owns its <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">data</tspan>; edits are JSON merge patches;</text>
<text x="612" y="396" font-size="10.5" fill="#1f2633">nobody edits a <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">hint</tspan> or a <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">steer</tspan>.</text>
<text x="891" y="558" font-size="9.5" fill="#5b6475" text-anchor="end">both lists on <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="8.7">attempt.started</tspan></text>
</svg>
