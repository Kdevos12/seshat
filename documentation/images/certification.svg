<text x="812" y="376.9" font-size="11.5" fill="#1d4a2e" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">certified</tspan></text>
<text x="843" y="391.4" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">proved</tspan>; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">refuted</tspan> for a proof</text>
<text x="843" y="405" font-size="10.5" fill="#1f2633" text-anchor="middle">of the negation</text>
<rect x="722" y="422" width="242" height="58" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="815.4" y="441.9" font-size="11.5" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">rejected</tspan></text>
<text x="843" y="456.4" font-size="10.5" fill="#1f2633" text-anchor="middle">stays <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">computed</tspan>; the reasons</text>
<text x="843" y="470" font-size="10.5" fill="#1f2633" text-anchor="middle">go in the validation</text>
<rect x="722" y="487" width="242" height="58" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="814.9" y="506.9" font-size="11.5" fill="#2b3340" font-weight="700">no answer</text>
<text x="843" y="521.4" font-size="10.5" fill="#1f2633" text-anchor="middle">timeout, aborted, unavailable:</text>
<text x="843" y="535" font-size="10.5" fill="#1f2633" text-anchor="middle">stays <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">computed</tspan>, no verdict</text>
