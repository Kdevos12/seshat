<text x="83.2" y="391.9" font-size="11.5" fill="#2b3340" font-weight="700">Candidate</text>
<text x="111" y="406.4" font-size="10.5" fill="#1f2633" text-anchor="middle">the file that passed</text>
<text x="111" y="420" font-size="10.5" fill="#1f2633" text-anchor="middle">the fast check</text>
<rect x="36" y="458" width="150" height="86" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="82.9" y="485.1" font-size="11.5" fill="#2b3340" font-weight="700">Reference</text>
<text x="111" y="499.6" font-size="10.5" fill="#1f2633" text-anchor="middle">the problem's file, or one</text>
<text x="111" y="513.2" font-size="10.5" fill="#1f2633" text-anchor="middle">rebuilt from the claim's</text>
<text x="111" y="526.9" font-size="10.5" fill="#1f2633" text-anchor="middle">journaled statement</text>
<rect x="230" y="358" width="146" height="86" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="252.5" y="385.1" font-size="11.5" fill="#1d4a2e" font-weight="700">Compile candidate</text>
<text x="303" y="399.6" font-size="10.5" fill="#1f2633" text-anchor="middle">fresh process, own dir;</text>
<text x="303" y="413.2" font-size="10.5" fill="#1f2633" text-anchor="middle">the proof's code runs</text>
<text x="303" y="426.8" font-size="10.5" fill="#1f2633" text-anchor="middle">here: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">.olean</tspan> out</text>
<rect x="230" y="458" width="146" height="86" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="253.2" y="485.1" font-size="11.5" fill="#1d4a2e" font-weight="700">Compile reference</text>
<text x="303" y="499.6" font-size="10.5" fill="#1f2633" text-anchor="middle">fresh process, own dir,</text>
<text x="303" y="513.2" font-size="10.5" fill="#1f2633" text-anchor="middle">after the first has ended;</text>
<text x="303" y="526.9" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">.olean</tspan> out</text>
<rect x="410" y="358" width="280" height="186" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="2.4" />
<g transform="translate(449.1,388.1) scale(0.8)" fill="none" stroke="#2e7448" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1.5 L17.5 4.5 V10 C17.5 14.5 14 17.5 10 18.8 C6 17.5 2.5 14.5 2.5 10 V4.5 Z"/><path d="M6.5 10.2 L9 12.7 L13.8 7.6"/></g>
<text x="471.1" y="401" font-size="11.5" fill="#1d4a2e" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">SeshatCertify</tspan>, a fresh process</text>
<text x="550" y="415.4" font-size="10.5" fill="#1f2633" text-anchor="middle">reads both <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">.olean</tspan> files as data;</text>
<text x="550" y="429.1" font-size="10.5" fill="#1f2633" text-anchor="middle">none of their code is loaded</text>
<text x="550" y="442.7" font-size="10.5" fill="#1f2633" text-anchor="middle"></text>
<text x="550" y="456.4" font-size="10.5" fill="#1f2633" text-anchor="middle">1 same imports; no unsafe, partial constant</text>
<text x="550" y="470" font-size="10.5" fill="#1f2633" text-anchor="middle">2 kernel replay of every constant</text>
<text x="550" y="483.7" font-size="10.5" fill="#1f2633" text-anchor="middle">3  target type compared as terms, with what it</text>
<text x="550" y="497.3" font-size="10.5" fill="#1f2633" text-anchor="middle">   rests on (a definition by value, no proofs)</text>
<text x="550" y="511" font-size="10.5" fill="#1f2633" text-anchor="middle">4  axioms collected by the program itself</text>
