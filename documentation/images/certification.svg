<text x="118" y="262" font-size="10" fill="#5b6475" text-anchor="middle">the prover edits two regions</text>
<text x="226" y="346" font-size="10" fill="#2b3340" font-weight="700">SANDBOX BEFORE EVERY <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">LAKE</tspan> CALL</text>
<text x="690" y="346" font-size="10" fill="#5b6475" text-anchor="end" font-style="italic">bubblewrap or Docker, per host profile</text>
