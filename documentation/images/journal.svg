<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">The journal: one chain of events, everything else rebuilt</title>
<defs><marker id="ah-3b4456" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#3b4456"/></marker><marker id="ah-a87414" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#a87414"/></marker></defs>
<rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">The journal: one chain of events, everything else rebuilt</text>
<text x="24" y="52" font-size="12" fill="#5b6475">Each event carries the hash of the one before; every table, report and view is a projection that can be deleted and rebuilt from it.</text>
<rect x="24" y="78" width="952" height="238" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="96" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(a) A HASH CHAIN OF THREE EVENTS (HASHES SHORTENED, FOR ILLUSTRATION)</text>
<rect x="24" y="330" width="952" height="168" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="348" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(b) WRITING: INVARIANTS FIRST, PROJECTIONS AFTER</text>
<rect x="634" y="346" width="330" height="144" rx="10" fill="#fdf9f0" stroke="#a87414" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="646" y="364" font-size="10.5" fill="#6b4a0c" font-weight="700" letter-spacing="0.8">PROJECTIONS, REBUILT FROM IT</text>
<rect x="24" y="512" width="470" height="150" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="530" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(c) RESUME AFTER A CRASH: ONLY THE JOURNAL IS NEEDED</text>
<rect x="506" y="512" width="470" height="150" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="518" y="530" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(d) <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--MEMORY-FROM</tspan>: A NEW RUN ON AN OLD ONE</text>
<rect x="36" y="106" width="292" height="134" rx="6" fill="#ffffff" stroke="#a87414" stroke-width="1.4"/><rect x="36" y="106" width="292" height="24" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4"/><rect x="37" y="120" width="290" height="10" fill="#fbf2dd"/><line x1="46" x2="318" y1="190" y2="190" stroke="#d5dae2"/>
<rect x="354" y="106" width="292" height="134" rx="6" fill="#ffffff" stroke="#a87414" stroke-width="1.4"/><rect x="354" y="106" width="292" height="24" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4"/><rect x="355" y="120" width="290" height="10" fill="#fbf2dd"/><line x1="364" x2="636" y1="190" y2="190" stroke="#d5dae2"/>
<rect x="672" y="106" width="292" height="134" rx="6" fill="#ffffff" stroke="#a87414" stroke-width="1.4"/><rect x="672" y="106" width="292" height="24" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4"/><rect x="673" y="120" width="290" height="10" fill="#fbf2dd"/><line x1="682" x2="954" y1="190" y2="190" stroke="#d5dae2"/>
<path d="M328,224 L336,224 Q341,224 341,219 L341,209 Q341,204 346,204 L354,204" fill="none" stroke="#a87414" stroke-width="1.4" marker-end="url(#ah-a87414)"/>
<path d="M646,224 L654,224 Q659,224 659,219 L659,209 Q659,204 664,204 L672,204" fill="none" stroke="#a87414" stroke-width="1.4" marker-end="url(#ah-a87414)"/>
<rect x="672" y="266" width="292" height="40" rx="5" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="818" y="290.7" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">blobs/c8/c81d90…</tspan>: the tool's output, by its hash</text>
<path d="M892,240 L892,266" fill="none" stroke="#a87414" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-a87414)"/>
<rect x="36" y="366" width="150" height="108" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="83.2" y="410.9" font-size="11.5" fill="#2b3340" font-weight="700">Producers</text>
<text x="111" y="425.4" font-size="10.5" fill="#1f2633" text-anchor="middle">orchestrator, provers,</text>
<text x="111" y="439" font-size="10.5" fill="#1f2633" text-anchor="middle">validator, capabilities</text>
<rect x="214" y="366" width="196" height="108" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="2.4" />
<text x="249.8" y="404.1" font-size="11.5" fill="#6b4a0c" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">emit</tspan> checks invariants</text>
<text x="312" y="418.6" font-size="10.5" fill="#1f2633" text-anchor="middle">a violation is refused and</text>
<text x="312" y="432.2" font-size="10.5" fill="#1f2633" text-anchor="middle">nothing is written: a <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">proved</tspan></text>
<text x="312" y="445.8" font-size="10.5" fill="#1f2633" text-anchor="middle">with no certified validation</text>
<rect x="438" y="366" width="164" height="108" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<g transform="translate(464.1,398) scale(0.8)" fill="none" stroke="#a87414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="10" cy="4.5" rx="7" ry="2.5"/><path d="M3 4.5v11c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-11"/><path d="M3 10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></g>
<text x="486.1" y="410.9" font-size="11.5" fill="#6b4a0c" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">journal.jsonl</tspan></text>
<text x="520" y="425.4" font-size="10.5" fill="#1f2633" text-anchor="middle">one event per line,</text>
<text x="520" y="439" font-size="10.5" fill="#1f2633" text-anchor="middle">appended, hash-chained</text>
<path d="M186,420 L214,420" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M410,420 L438,420" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
