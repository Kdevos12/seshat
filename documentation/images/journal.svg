<text x="726" y="389.5" font-size="10.5" fill="#6b4a0c" text-anchor="middle" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">projection.sqlite</tspan></text>
<rect x="814" y="376" width="140" height="19.5" rx="9.8" fill="#fbf2dd" stroke="#a87414" stroke-width="1.2" />
<text x="884" y="389.5" font-size="10.5" fill="#6b4a0c" text-anchor="middle" font-weight="700">memory store</text>
<rect x="646" y="410" width="160" height="19.5" rx="9.8" fill="#fbf2dd" stroke="#a87414" stroke-width="1.2" />
<text x="726" y="423.5" font-size="10.5" fill="#6b4a0c" text-anchor="middle" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">RESULT.md</tspan></text>
<rect x="814" y="410" width="140" height="19.5" rx="9.8" fill="#fbf2dd" stroke="#a87414" stroke-width="1.2" />
<text x="884" y="423.5" font-size="10.5" fill="#6b4a0c" text-anchor="middle" font-weight="700">report</text>
<rect x="646" y="444" width="160" height="19.5" rx="9.8" fill="#fbf2dd" stroke="#a87414" stroke-width="1.2" />
<text x="726" y="457.5" font-size="10.5" fill="#6b4a0c" text-anchor="middle" font-weight="700">view</text>
<rect x="814" y="444" width="140" height="19.5" rx="9.8" fill="#fbf2dd" stroke="#a87414" stroke-width="1.2" />
<text x="884" y="457.5" font-size="10.5" fill="#6b4a0c" text-anchor="middle" font-weight="700">UI</text>
<path d="M602,420 L634,420" fill="none" stroke="#a87414" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-a87414)"/>
<rect x="36" y="544" width="138" height="102" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="83" y="572.3" font-size="11.5" fill="#2b3340" font-weight="700">Torn tail</text>
<text x="105" y="586.7" font-size="10.5" fill="#1f2633" text-anchor="middle">a cut last line is</text>
<text x="105" y="600.4" font-size="10.5" fill="#1f2633" text-anchor="middle">dropped; a whole</text>
<text x="105" y="614" font-size="10.5" fill="#1f2633" text-anchor="middle">event lacking its</text>
<text x="105" y="627.7" font-size="10.5" fill="#1f2633" text-anchor="middle">newline is kept</text>
<rect x="186" y="544" width="138" height="102" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<text x="217.1" y="572.3" font-size="11.5" fill="#6b4a0c" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">run.resumed</tspan></text>
<text x="255" y="586.7" font-size="10.5" fill="#1f2633" text-anchor="middle">numbered 1, 2...;</text>
<text x="255" y="600.4" font-size="10.5" fill="#1f2633" text-anchor="middle">records what was</text>
<text x="255" y="614" font-size="10.5" fill="#1f2633" text-anchor="middle">spent and what was</text>
<text x="255" y="627.7" font-size="10.5" fill="#1f2633" text-anchor="middle">interrupted</text>
<rect x="336" y="544" width="138" height="102" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="353.5" y="572.3" font-size="11.5" fill="#2b3340" font-weight="700">Close what is open</text>
<text x="405" y="586.7" font-size="10.5" fill="#1f2633" text-anchor="middle">tool runs, attempts:</text>
<text x="405" y="600.4" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">aborted</tspan>; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">running</tspan></text>
<text x="405" y="614" font-size="10.5" fill="#1f2633" text-anchor="middle">tasks: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">ready</tspan>, then</text>
<text x="405" y="627.7" font-size="10.5" fill="#1f2633" text-anchor="middle">run again</text>
<path d="M174,595 L186,595" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M324,595 L336,595" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="518" y="548" width="160" height="98" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<text x="560.4" y="581.1" font-size="11.5" fill="#6b4a0c" font-weight="700">Earlier journal</text>
<text x="598" y="595.6" font-size="10.5" fill="#1f2633" text-anchor="middle">read whole, chain</text>
<text x="598" y="609.2" font-size="10.5" fill="#1f2633" text-anchor="middle">verified, never written;</text>
<text x="598" y="622.9" font-size="10.5" fill="#1f2633" text-anchor="middle">ends at <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">e413b8</tspan></text>
<rect x="774" y="548" width="190" height="98" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<text x="817.2" y="581.1" font-size="11.5" fill="#6b4a0c" font-weight="700">New <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">run.started</tspan></text>
<text x="869" y="595.6" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">memoryFrom</tspan>: path, run id,</text>
<text x="869" y="609.2" font-size="10.5" fill="#1f2633" text-anchor="middle">last hash <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">e413b8</tspan>,</text>
<text x="869" y="622.9" font-size="10.5" fill="#1f2633" text-anchor="middle">number of events</text>
<path d="M774,597 L678,597" fill="none" stroke="#a87414" stroke-width="1.4" marker-end="url(#ah-a87414)"/>
