<text x="364" y="208" font-size="10.5" fill="#1f2633"><tspan font-weight="700">prev</tspan>  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">9f2c41</tspan></text>
<text x="364" y="228" font-size="10.5" fill="#6b4a0c"><tspan font-weight="700">hash</tspan>  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">5ab07e</tspan></text>
<text x="682" y="122" font-size="11.5" fill="#6b4a0c"><tspan font-weight="700">seq 2</tspan>  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">tool_run.finished</tspan></text>
<text x="682" y="148" font-size="10.5" fill="#5b6475">actor <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lean.check</tspan></text>
<text x="682" y="164" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">outcome</tspan>: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">ok</tspan>,</text>
<text x="682" y="177.7" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">outputHash</tspan>: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">c81d90</tspan></text>
<text x="682" y="208" font-size="10.5" fill="#1f2633"><tspan font-weight="700">prev</tspan>  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">5ab07e</tspan></text>
<text x="682" y="228" font-size="10.5" fill="#6b4a0c"><tspan font-weight="700">hash</tspan>  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">e413b8</tspan></text>
<text x="36" y="268" font-size="10.5" fill="#5b6475"><tspan font-weight="700">hash</tspan> = sha256 of the event's canonical JSON without <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">hash</tspan>:</text>
<text x="36" y="283" font-size="10.5" fill="#5b6475">change, remove or reorder an event and the chain breaks; the journal then refuses to open.</text>
<text x="36" y="298" font-size="10.5" fill="#5b6475">Large contents (files, tool inputs and outputs) live in <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">blobs/</tspan>; events carry their hashes.</text>
<text x="726" y="580" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pinned;</text>
<text x="726" y="593.1" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">checked</text>
<text x="726" y="606.2" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">at every</text>
<text x="726" y="619.4" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">open</text>
