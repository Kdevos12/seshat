<text x="46" y="228" font-size="10.5" fill="#6b4a0c"><tspan font-weight="700">hash</tspan>  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">9f2c41</tspan></text>
<text x="364" y="122" font-size="11.5" fill="#6b4a0c"><tspan font-weight="700">seq 1</tspan>  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">claim.created</tspan></text>
<text x="364" y="148" font-size="10.5" fill="#5b6475">actor <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">orchestrator</tspan></text>
<text x="364" y="164" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">claimId</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">statementId</tspan>,</text>
