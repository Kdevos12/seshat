<text x="46" y="148" font-size="10.5" fill="#5b6475">actor <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">orchestrator</tspan></text>
<text x="46" y="164" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">runId</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">problems</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">host</tspan>,</text>
<text x="46" y="177.7" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">config</tspan></text>
