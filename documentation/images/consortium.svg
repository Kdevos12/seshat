<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">Consortium mode: the run stops, says where it stands, and waits</text>
<text x="24" y="52" font-size="12" fill="#5b6475">A turn ends at a limit or a breakpoint; the account is built from the journal with no model, and the team's answers steer the next turn without changing a status.</text>
