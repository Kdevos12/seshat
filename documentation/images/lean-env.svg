<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">Lean environments as data, and the gate in front of new Lean</title>
<defs><marker id="ah-3b4456" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#3b4456"/></marker></defs>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">Lean environments as data, and the gate in front of new Lean</text>
<text x="24" y="52" font-size="12" fill="#5b6475">An environment is a file the resolver checks before anything is built; what a coding agent writes reaches it only through Seshat's gate.</text>
<rect x="24" y="76" width="952" height="196" rx="10" fill="#f4f9f6" stroke="#2e7448" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="36" y="94" font-size="10.5" fill="#1d4a2e" font-weight="700" letter-spacing="0.8">(a) AN ENVIRONMENT, FROM ITS FILE TO EVERY TOOL RUN</text>
<rect x="24" y="288" width="952" height="226" rx="10" fill="#f6f8fa" stroke="#4a5567" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="36" y="306" font-size="10.5" fill="#2b3340" font-weight="700" letter-spacing="0.8">(b) THE LIBRARYBUILDER (OFF BY DEFAULT): A CODING AGENT BEHIND SESHAT'S GATE</text>
<rect x="40" y="110" width="200" height="140" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="64.1" y="150.4" font-size="11.5" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">lean/env/extended.toml</tspan></text>
<text x="140" y="164.9" font-size="10.5" fill="#1f2633" text-anchor="middle">toolchain <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">v4.27.0</tspan></text>
<text x="140" y="178.5" font-size="10.5" fill="#1f2633" text-anchor="middle">base: formal-conjectures</text>
<text x="140" y="192.2" font-size="10.5" fill="#1f2633" text-anchor="middle">at <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">bench-v1-lean4.27.0</tspan></text>
<text x="140" y="205.8" font-size="10.5" fill="#1f2633" text-anchor="middle">packages: Duper, LeanAPAP,</text>
<text x="140" y="219.5" font-size="10.5" fill="#1f2633" text-anchor="middle">PFR; local: SeshatMeta</text>
<rect x="270" y="110" width="220" height="140" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="357" y="145.3" font-size="11" fill="#2b3340" font-weight="700">Resolver</text>
<text x="380" y="159.2" font-size="10" fill="#1f2633" text-anchor="middle">reads each package's <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">lean-toolchain</tspan></text>
<text x="380" y="172.2" font-size="10" fill="#1f2633" text-anchor="middle">and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">lake-manifest.json</tspan>;</text>
<text x="380" y="185.2" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-weight="700">refuses</tspan>, naming every problem:</text>
<text x="380" y="198.2" font-size="10" fill="#1f2633" text-anchor="middle">two toolchains; a shared dependency</text>
<text x="380" y="211.2" font-size="10" fill="#1f2633" text-anchor="middle">at two commits; a revision that</text>
<text x="380" y="224.2" font-size="10" fill="#1f2633" text-anchor="middle">another package does not want</text>
<rect x="520" y="110" width="200" height="140" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="580.4" y="150.4" font-size="11.5" fill="#6b4a0c" font-weight="700">Lock and hash</text>
<text x="620" y="164.9" font-size="10.5" fill="#1f2633" text-anchor="middle">SHA-256 of the canonical</text>
<text x="620" y="178.5" font-size="10.5" fill="#1f2633" text-anchor="middle">JSON of the toolchain, the</text>
<text x="620" y="192.2" font-size="10.5" fill="#1f2633" text-anchor="middle">packages and every</text>
<text x="620" y="205.8" font-size="10.5" fill="#1f2633" text-anchor="middle">dependency's commit; same</text>
<text x="620" y="219.5" font-size="10.5" fill="#1f2633" text-anchor="middle">hash: same Lean, same Mathlib</text>
<rect x="750" y="110" width="210" height="140" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="818.1" y="150.4" font-size="11.5" fill="#1d4a2e" font-weight="700">Build and use</text>
<text x="855" y="164.9" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lake exe cache get</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lake build</tspan>;</text>
<text x="855" y="178.5" font-size="10.5" fill="#1f2633" text-anchor="middle">the project the Lean tools</text>
<text x="855" y="192.2" font-size="10.5" fill="#1f2633" text-anchor="middle">run in; the hash is in the</text>
<text x="855" y="205.8" font-size="10.5" fill="#1f2633" text-anchor="middle">version of every Lean tool</text>
<text x="855" y="219.5" font-size="10.5" fill="#1f2633" text-anchor="middle">run, so results never mix</text>
<path d="M240,180 L270,180" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M490,180 L520,180" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M720,180 L750,180" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="40" y="328" width="170" height="120" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" stroke-dasharray="5 3"/>
<g transform="translate(77.7,345.5) scale(0.8)" fill="none" stroke="#6a4c9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 C8.8 6.6 10.4 8.2 15 9 C10.4 9.8 8.8 11.4 8 16 C7.2 11.4 5.6 9.8 1 9 C5.6 8.2 7.2 6.6 8 2 Z"/><path d="M15.5 12.5 C15.8 14.2 16.3 14.7 18 15 C16.3 15.3 15.8 15.8 15.5 17.5 C15.2 15.8 14.7 15.3 13 15 C14.7 14.7 15.2 14.2 15.5 12.5 Z"/></g>
<text x="99.7" y="358.5" font-size="11.5" fill="#45306a" font-weight="700">Coding agent</text>
<text x="125" y="372.9" font-size="10.5" fill="#1f2633" text-anchor="middle">in a sandboxed clone,</text>
<text x="125" y="386.6" font-size="10.5" fill="#1f2633" text-anchor="middle">with only the variables</text>
<text x="125" y="400.2" font-size="10.5" fill="#1f2633" text-anchor="middle">the config names; adds</text>
<text x="125" y="413.8" font-size="10.5" fill="#1f2633" text-anchor="middle">files under</text>
<text x="125" y="427.5" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lean/SeshatLib/&lt;Domain&gt;/</tspan></text>
<rect x="250" y="328" width="112" height="56" rx="6" fill="#e5eff8" stroke="#2a6496" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="293.4" y="347.8" font-size="10.5" fill="#1b4266" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">diff</tspan></text>
<text x="306" y="360.9" font-size="9.5" fill="#1f2633" text-anchor="middle">only new, regular</text>
<text x="306" y="373.3" font-size="9.5" fill="#1f2633" text-anchor="middle">files, one directory</text>
<rect x="370" y="328" width="112" height="56" rx="6" fill="#e5eff8" stroke="#2a6496" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="403.9" y="347.8" font-size="10.5" fill="#1b4266" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">content</tspan></text>
<text x="426" y="360.9" font-size="9.5" fill="#1f2633" text-anchor="middle">the validator's</text>
<text x="426" y="373.3" font-size="9.5" fill="#1f2633" text-anchor="middle">token screen</text>
<path d="M362,356 L370,356" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="490" y="328" width="112" height="56" rx="6" fill="#e5eff8" stroke="#2a6496" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="533.4" y="347.8" font-size="10.5" fill="#1b4266" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">spec</tspan></text>
<text x="546" y="360.9" font-size="9.5" fill="#1f2633" text-anchor="middle">items and test</text>
<text x="546" y="373.3" font-size="9.5" fill="#1f2633" text-anchor="middle">lemmas exist</text>
<path d="M482,356 L490,356" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="610" y="328" width="112" height="56" rx="6" fill="#e5eff8" stroke="#2a6496" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="650.3" y="347.8" font-size="10.5" fill="#1b4266" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">build</tspan></text>
<text x="666" y="360.9" font-size="9.5" fill="#1f2633" text-anchor="middle">fresh checkout,</text>
<text x="666" y="373.3" font-size="9.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="8.7">lake build</tspan></text>
<path d="M602,356 L610,356" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="730" y="328" width="112" height="56" rx="6" fill="#e5eff8" stroke="#2a6496" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="748.2" y="347.8" font-size="10.5" fill="#1b4266" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">build_output</tspan></text>
<text x="786" y="360.9" font-size="9.5" fill="#1f2633" text-anchor="middle">no <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="8.7">sorry</tspan> in</text>
<text x="786" y="373.3" font-size="9.5" fill="#1f2633" text-anchor="middle">the build output</text>
<path d="M722,356 L730,356" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="850" y="328" width="112" height="56" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="884" y="347.8" font-size="10.5" fill="#1d4a2e" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">certify</tspan></text>
<text x="906" y="360.9" font-size="9.5" fill="#1f2633" text-anchor="middle">every new theorem</text>
<text x="906" y="373.3" font-size="9.5" fill="#1f2633" text-anchor="middle">kernel-replayed</text>
<path d="M842,356 L850,356" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M210,364 L250,356" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="250" y="412" width="350" height="76" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="326.2" y="434.9" font-size="11" fill="#6b4a0c" font-weight="700">Accepted: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">adoptBuild</tspan>, between runs</text>
<text x="425" y="448.7" font-size="10" fill="#1f2633" text-anchor="middle">files land all or none; the local package's hash</text>
<text x="425" y="461.7" font-size="10" fill="#1f2633" text-anchor="middle">changes, so the next resolve gives a new environment</text>
<text x="425" y="474.7" font-size="10" fill="#1f2633" text-anchor="middle">hash; a run that is going keeps its own</text>
<rect x="620" y="412" width="342" height="76" rx="6" fill="#fae8ee" stroke="#ad4468" stroke-width="1.4" stroke-dasharray="5 3"/>
<g transform="translate(695.8,422.4) scale(0.8)" fill="none" stroke="#ad4468" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="6" r="3.3"/><path d="M3.5 18c0-3.9 2.9-6.5 6.5-6.5s6.5 2.6 6.5 6.5"/></g>
<text x="717.8" y="434.9" font-size="11" fill="#6e2540" font-weight="700">New definitions are <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">unreviewed</tspan></text>
<text x="791" y="448.7" font-size="10" fill="#1f2633" text-anchor="middle">a proof may use one (the kernel checks it); a claim</text>
<text x="791" y="461.7" font-size="10" fill="#1f2633" text-anchor="middle">statement may not, until a person signs it faithful</text>
<text x="791" y="474.7" font-size="10" fill="#1f2633" text-anchor="middle">(<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">harness library review NAME --as PERSON</tspan>)</text>
<path d="M906,384 L906,391 Q906,398 899,398 L432,398 Q425,398 425,405 L425,412" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M906,398 L798,398 Q791,398 791,405 L791,412" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<text x="250" y="320" font-size="10.5" fill="#5b6475">Seshat's gate: in order; the first rule that fails ends the build; each check is journaled</text>
<circle cx="252" cy="330" r="7" fill="#2a6496"/><text x="252" y="333.6" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<circle cx="372" cy="330" r="7" fill="#2a6496"/><text x="372" y="333.6" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<circle cx="492" cy="330" r="7" fill="#2a6496"/><text x="492" y="333.6" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<circle cx="612" cy="330" r="7" fill="#2a6496"/><text x="612" y="333.6" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<circle cx="732" cy="330" r="7" fill="#2a6496"/><text x="732" y="333.6" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<circle cx="852" cy="330" r="7" fill="#2e7448"/><text x="852" y="333.6" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<text x="230" y="351.7" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">files</text>
<rect x="24" y="531" width="22" height="14" rx="3" fill="#ffffff" stroke="#4a5567" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="52" y="542" font-size="10.5" fill="#5b6475">built, tested with simulations only</text>
</svg>
