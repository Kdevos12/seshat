<rect x="812" y="176" width="88" height="19" rx="9.5" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.2" />
<text x="856" y="189.1" font-size="10" fill="#1d4a2e" text-anchor="middle" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">lean_checked</tspan></text>
<rect x="36" y="380" width="340" height="44" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="174.9" y="399.8" font-size="11.5" fill="#1d4a2e" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">aux_m2_p1</tspan></text>
<text x="206" y="414.2" font-size="10.5" fill="#1f2633" text-anchor="middle">the proof of V, from the memory</text>
<rect x="36" y="432" width="340" height="44" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="174.9" y="451.8" font-size="11.5" fill="#1d4a2e" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">aux_m2_l1</tspan></text>
<text x="206" y="466.2" font-size="10.5" fill="#1f2633" text-anchor="middle">the link lemma <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">V → C</tspan>, with the proof that checked it</text>
<rect x="412" y="380" width="212" height="96" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="486.9" y="405.3" font-size="11.5" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">aux_m2_d1</tspan></text>
<text x="518" y="419.7" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">exact L X n</tspan>:</text>
<text x="518" y="433.4" font-size="10.5" fill="#1f2633" text-anchor="middle">the step of the rule</text>
<text x="518" y="447" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">strengthens/proved</tspan>,</text>
<text x="518" y="460.7" font-size="10.5" fill="#1f2633" text-anchor="middle">the submitted proof</text>
<rect x="660" y="380" width="140" height="96" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="2.4" />
<g transform="translate(691.4,412.8) scale(0.8)" fill="none" stroke="#2e7448" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1.5 L17.5 4.5 V10 C17.5 14.5 14 17.5 10 18.8 C6 17.5 2.5 14.5 2.5 10 V4.5 Z"/><path d="M6.5 10.2 L9 12.7 L13.8 7.6"/></g>
<text x="713.4" y="425.8" font-size="11.5" fill="#1d4a2e" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">validate</tspan></text>
<text x="730" y="440.2" font-size="10.5" fill="#1f2633" text-anchor="middle">the fast check</text>
<rect x="836" y="380" width="128" height="96" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="866.3" y="418.9" font-size="11.5" fill="#1d4a2e" font-weight="700">C <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">computed</tspan></text>
<text x="900" y="433.4" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">proved</tspan> once the</text>
<text x="900" y="447" font-size="10.5" fill="#1f2633" text-anchor="middle">certifier replays it</text>
<path d="M376,402 L412,402" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M376,454 L412,454" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M624,428 L660,428" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M800,428 L836,428" fill="none" stroke="#2e7448" stroke-width="1.4" marker-end="url(#ah-2e7448)"/>
<rect x="36" y="526" width="170" height="40" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" />
<text x="100" y="543.8" font-size="11.5" fill="#45306a" font-weight="700">Provers</text>
<text x="121" y="558.2" font-size="10.5" fill="#1f2633" text-anchor="middle">try C</text>
<rect x="36" y="606" width="170" height="40" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" />
<text x="96.8" y="623.8" font-size="11.5" fill="#45306a" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">runTwin</tspan></text>
<text x="121" y="638.2" font-size="10.5" fill="#1f2633" text-anchor="middle">try <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">¬ C</tspan>, up to N calls</text>
<rect x="250" y="526" width="150" height="40" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="305.1" y="543.8" font-size="11.5" fill="#2b3340" font-weight="700">C <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">open</tspan></text>
<text x="325" y="558.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">n + 0 = n</tspan></text>
<rect x="250" y="606" width="150" height="40" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="299.2" y="623.8" font-size="11.5" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">¬ C</tspan> <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">open</tspan></text>
<text x="325" y="638.2" font-size="10.5" fill="#1f2633" text-anchor="middle">its negation, a claim</text>
<path d="M206,546 L250,546" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M206,626 L250,626" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M325,566 L325,606" fill="none" stroke="#2e7448" stroke-width="1.4" marker-end="url(#ah-2e7448)" marker-start="url(#ah-2e7448)"/>
<rect x="560" y="526" width="404" height="120" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="702" y="549.6" font-size="11.5" fill="#2b3340" font-weight="700">When one side settles</text>
<text x="762" y="564.1" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">twinSettled</tspan> reads the graph: a proof of C refutes <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">¬ C</tspan></text>
<text x="762" y="577.7" font-size="10.5" fill="#1f2633" text-anchor="middle">and a proof of <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">¬ C</tspan> refutes C (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">negation_of/proved</tspan>,</text>
<text x="762" y="591.4" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">negation_of/proved-back</tspan>); the other side stops.</text>
<text x="762" y="605" font-size="10.5" fill="#1f2633" text-anchor="middle"></text>
<text x="762" y="618.7" font-size="10.5" fill="#1f2633" text-anchor="middle">Framing is neutral: the model is never told whether</text>
<text x="762" y="632.3" font-size="10.5" fill="#1f2633" text-anchor="middle">the statement is true or false.</text>
<path d="M400,546 L560,546" fill="none" stroke="#2e7448" stroke-width="1.4" marker-end="url(#ah-2e7448)"/>
<path d="M400,626 L560,626" fill="none" stroke="#2e7448" stroke-width="1.4" marker-end="url(#ah-2e7448)"/>
<text x="86" y="170" font-size="10" fill="#5b6475"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">strengthens</tspan></text>
<text x="38" y="276" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">createVariant</tspan>: V is a claim</text>
<text x="38" y="289.6" font-size="10.5" fill="#1f2633">of its own (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">ensureClaim</tspan>), and</text>
<text x="38" y="303.3" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">proposeEdge</tspan> writes the link</text>
<text x="38" y="316.9" font-size="10.5" fill="#1f2633">lemma <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">V → C</tspan>. No status moves.</text>
<text x="328" y="170" font-size="10" fill="#5b6475"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">strengthens</tspan></text>
<text x="280" y="276" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">checkEdge</tspan> states the lemma as</text>
<text x="280" y="289.6" font-size="10.5" fill="#1f2633">a claim; cheap tactics (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">tauto</tspan>,</text>
<text x="280" y="303.3" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">omega</tspan>...) go through <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">validate</tspan>;</text>
<text x="280" y="316.9" font-size="10.5" fill="#1f2633">a valid proof checks the edge.</text>
<text x="570" y="170" font-size="10" fill="#5b6475"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">strengthens</tspan></text>
<text x="522" y="276" font-size="10.5" fill="#1f2633">A prover settles V. Rule</text>
<text x="522" y="289.6" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">strengthens/proved</tspan> derives C;</text>
<text x="522" y="303.3" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">realize</tspan> composes a proof and</text>
<text x="522" y="316.9" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">validate</tspan> accepts it (below).</text>
<text x="812" y="170" font-size="10" fill="#5b6475"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">strengthens</tspan></text>
<text x="764" y="276" font-size="10.5" fill="#1f2633">V is retracted: what rested on</text>
<text x="764" y="289.6" font-size="10.5" fill="#1f2633">it is deleted and re-derived;</text>
<text x="764" y="303.3" font-size="10.5" fill="#1f2633">C held only by a composed proof,</text>
<text x="764" y="316.9" font-size="10.5" fill="#1f2633">so <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">revokeUnsupported</tspan> reopens it.</text>
<text x="337" y="590" font-size="10" fill="#5b6475"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">negation_of</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">lean_checked</tspan></text>
</svg>
