<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">Graph: a result on one claim becomes a result on its neighbour</title>
<defs><marker id="ah-2e7448" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#2e7448"/></marker><marker id="ah-3b4456" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#3b4456"/></marker><marker id="ah-8b94a5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#8b94a5"/></marker></defs>
<rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">Graph: a result on one claim becomes a result on its neighbour</text>
<text x="24" y="52" font-size="12" fill="#5b6475">Only <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">lean_checked</tspan> edges propagate; what a rule derives is a proposal, a composed proof that must pass <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">validate</tspan> like any other.</text>
<rect x="24" y="76" width="226" height="262" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">1 PROPOSE</text>
<rect x="266" y="76" width="226" height="262" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="278" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">2 CHECK THE LINK</text>
<rect x="508" y="76" width="226" height="262" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="520" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">3 SETTLE AND PROPAGATE</text>
<rect x="750" y="76" width="226" height="262" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="762" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">4 REVOKE</text>
<rect x="24" y="350" width="952" height="134" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="368" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">WHAT <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">REALIZE</tspan> COMPOSES IN STEP 3</text>
<rect x="24" y="496" width="952" height="168" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="514" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">THE PROVE/REFUTE TWIN</text>
<rect x="40" y="106" width="194" height="50" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="115.7" y="128.8" font-size="11.5" fill="#2b3340" font-weight="700">V  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">open</tspan></text>
<text x="137" y="143.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">n + 0 = n ∧ 0 + n = n</tspan></text>
