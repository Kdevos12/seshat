<text x="379" y="143.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">n + 0 = n ∧ 0 + n = n</tspan></text>
