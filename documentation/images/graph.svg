<text x="115.4" y="224.8" font-size="11.5" fill="#2b3340" font-weight="700">C  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">open</tspan></text>
<text x="137" y="239.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">n + 0 = n</tspan></text>
