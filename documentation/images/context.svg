<text x="79.7" y="535.4" font-size="11" fill="#1b4266" font-weight="700">Selectors</text>
<text x="104" y="549.1" font-size="10" fill="#1f2633" text-anchor="middle">MePo, SInE,</text>
<text x="104" y="562.1" font-size="10" fill="#1f2633" text-anchor="middle">online k-NN over</text>
<text x="104" y="575.1" font-size="10" fill="#1f2633" text-anchor="middle">the run's proofs,</text>
<text x="104" y="588.1" font-size="10" fill="#1f2633" text-anchor="middle">pattern seeds</text>
<rect x="202" y="508" width="120" height="98" rx="6" fill="#e5eff8" stroke="#2a6496" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="231.5" y="548.4" font-size="11" fill="#1b4266" font-weight="700">Convex mix</text>
<text x="262" y="562.1" font-size="10" fill="#1f2633" text-anchor="middle">of the channels,</text>
<text x="262" y="575.1" font-size="10" fill="#1f2633" text-anchor="middle">no training</text>
<rect x="352" y="508" width="150" height="98" rx="6" fill="#e5eff8" stroke="#2a6496" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="395.3" y="535.4" font-size="11" fill="#1b4266" font-weight="700">Accessibility</text>
<text x="427" y="549.1" font-size="10" fill="#1f2633" text-anchor="middle">a premise the file's</text>
<text x="427" y="562.1" font-size="10" fill="#1f2633" text-anchor="middle">header cannot see is</text>
<text x="427" y="575.1" font-size="10" fill="#1f2633" text-anchor="middle">not offered, or marked</text>
<text x="427" y="588.1" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">(needs: import M)</tspan></text>
