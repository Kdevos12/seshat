<text x="826" y="541.6" font-size="10" fill="#1f2633" text-anchor="middle">one item in full, with its neighbours</text>
<rect x="688" y="562" width="276" height="44" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="789.7" y="581.9" font-size="11" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">graph_query</tspan></text>
<text x="826" y="595.6" font-size="10" fill="#1f2633" text-anchor="middle">a pattern, anchors, or a typed query</text>
<text x="36" y="114" font-size="11" fill="#1f2633"><tspan font-weight="700">Raw history</tspan>: each request resends the conversation, so it grows</text>
<text x="504" y="114" font-size="11" fill="#1f2633"><tspan font-weight="700">Packet</tspan>: the prefix stays byte for byte, the tail is new</text>
<text x="36" y="140" font-size="10" fill="#5b6475">request 1</text>
<text x="504" y="140" font-size="10" fill="#5b6475">request 1</text>
