<text x="606.8" y="280" font-size="10.5" fill="#5b6475">tail</text>
<text x="36" y="340" font-size="10.5" fill="#1f2633"><tspan font-weight="700">Prefix</tspan>, 4800 tokens: frozen at the first request, sections in a fixed order</text>
<text x="786.4" y="340" font-size="10.5" fill="#1f2633"><tspan font-weight="700">Tail</tspan>, 1200 tokens</text>
<text x="97.9" y="371.8" font-size="10.5" fill="#2b3340" text-anchor="middle" font-weight="700">Goal</text>
<text x="41" y="402" font-size="10" fill="#2b3340">the claim's id and</text>
<text x="41" y="415" font-size="10" fill="#2b3340">statement, as Lean;</text>
<text x="41" y="428" font-size="10" fill="#2b3340">always kept</text>
<text x="221.6" y="371.8" font-size="10.5" fill="#2b3340" text-anchor="middle" font-weight="700">Useful facts</text>
<text x="164.7" y="402" font-size="10" fill="#2b3340">PageRank and symbol</text>
<text x="164.7" y="415" font-size="10" fill="#2b3340">similarity; badges;</text>
<text x="164.7" y="428" font-size="10" fill="#2b3340">ids <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">C</tspan> and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">E</tspan></text>
<text x="345.3" y="371.8" font-size="10.5" fill="#2b3340" text-anchor="middle" font-weight="700">Candidate premises</text>
<text x="288.5" y="402" font-size="10" fill="#2b3340">local, library, other</text>
<text x="288.5" y="415" font-size="10" fill="#2b3340">packages, Mathlib;</text>
<text x="288.5" y="428" font-size="10" fill="#2b3340">ids <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">L</tspan></text>
<text x="469.1" y="371.8" font-size="10.5" fill="#2b3340" text-anchor="middle" font-weight="700">Already tried</text>
<text x="412.2" y="402" font-size="10" fill="#2b3340">M1's lines, at most</text>
<text x="412.2" y="415" font-size="10" fill="#2b3340"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">maxTried</tspan></text>
<text x="592.8" y="371.8" font-size="10.5" fill="#2b3340" text-anchor="middle" font-weight="700">Active lessons</text>
<text x="535.9" y="402" font-size="10" fill="#2b3340">M5's, as the draw</text>
<text x="535.9" y="415" font-size="10" fill="#2b3340">left them; ids <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">A</tspan></text>
<text x="716.5" y="371.8" font-size="10.5" fill="#2b3340" text-anchor="middle" font-weight="700">Other lines' notes</text>
<text x="659.7" y="402" font-size="10" fill="#2b3340">briefings, screened</text>
<text x="659.7" y="415" font-size="10" fill="#2b3340">and capped</text>
<text x="871.2" y="371.8" font-size="10.5" fill="#1b4266" text-anchor="middle" font-weight="700">Tail</text>
<text x="783.4" y="402" font-size="10" fill="#2b3340">where the session stands,</text>
<text x="783.4" y="415" font-size="10" fill="#2b3340">file regions, holes,</text>
<text x="783.4" y="428" font-size="10" fill="#2b3340">last raw Lean answer,</text>
<text x="783.4" y="441" font-size="10" fill="#2b3340">tool answers, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">newSince</tspan></text>
<text x="36" y="456" font-size="10" fill="#5b6475">every shown item has a citable id; an item the budget cut has none. The sections are not drawn to scale: their sizes vary.</text>
<text x="826" y="502" font-size="9.5" fill="#5b6475" text-anchor="middle">journaled as tool runs of <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="8.7">line:M4</tspan>; answers go in the tail</text>
<rect x="24" y="635" width="22" height="14" rx="3" fill="#ffffff" stroke="#4a5567" stroke-width="1.4" />
<text x="52" y="646" font-size="10.5" fill="#5b6475">has run for real (Lean 4.27, a real model)</text>
