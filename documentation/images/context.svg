<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">Context: a packet under a budget, not the whole history</text>
<text x="24" y="52" font-size="12" fill="#5b6475">Line M4 sends each request a frozen prefix and a freshly compiled tail, with citable ids and two tools to look further.</text>
<rect x="24" y="76" width="952" height="214" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(a) WHAT EACH REQUEST CARRIES</text>
<rect x="24" y="302" width="952" height="168" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="320" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(b) ONE PACKET AT THE DEFAULT BUDGET: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">TOKENS</tspan> 6000, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">PREFIXSHARE</tspan> 0.8</text>
