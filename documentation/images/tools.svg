<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 724" width="1000" height="724" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">Tools: every tool sits behind a capability</title>
<defs><marker id="ah-2b7d78" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#2b7d78"/></marker><marker id="ah-3b4456" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#3b4456"/></marker><marker id="ah-a87414" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#a87414"/></marker></defs>
<rect x="0" y="0" width="1000" height="724" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">Tools: every tool sits behind a capability</text>
<text x="24" y="52" font-size="12" fill="#5b6475">Callers name a capability; the host profile picks the implementation, the registry checks and journals the call, and no tool sets a status.</text>
<rect x="24" y="76" width="952" height="242" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(a) ONE CALL</text>
<text x="964" y="94" font-size="10.5" fill="#5b6475" text-anchor="end" font-style="italic">profile <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">use</tspan>: the next implementation is tried only if one cannot be reached</text>
<rect x="24" y="330" width="952" height="212" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="348" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(b) LEVELS AND PACKS</text>
<rect x="24" y="554" width="952" height="150" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="572" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(c) THIRD PARTIES: ONE RULE, ENFORCED BY THE REGISTRY BEFORE ANY IMPLEMENTATION</text>
<rect x="36" y="106" width="200" height="56" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="93.1" y="125.3" font-size="11" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">manifest.json</tspan></text>
<text x="136" y="139.2" font-size="10" fill="#1f2633" text-anchor="middle">the contract: schemas, level,</text>
<text x="136" y="152.2" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">produces</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">thirdParty</tspan></text>
<rect x="36" y="170" width="200" height="56" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="93.1" y="189.3" font-size="11" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">contract.json</tspan></text>
<text x="136" y="203.2" font-size="10" fill="#1f2633" text-anchor="middle">golden cases, run before an</text>
<text x="136" y="216.2" font-size="10" fill="#1f2633" text-anchor="middle">implementation is trusted</text>
<rect x="36" y="234" width="200" height="56" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="106.5" y="253.3" font-size="11" fill="#2b3340" font-weight="700">Host profile</text>
<text x="136" y="267.1" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">use</tspan> order, settings,</text>
<text x="136" y="280.1" font-size="10" fill="#1f2633" text-anchor="middle">time limit, per host</text>
<rect x="272" y="106" width="240" height="184" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="2.4" />
<text x="340.3" y="154.8" font-size="11.5" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">registry.invoke</tspan></text>
<text x="392" y="169.2" font-size="10.5" fill="#1f2633" text-anchor="middle">1 input checked against the schema</text>
<text x="392" y="182.9" font-size="10.5" fill="#1f2633" text-anchor="middle">2 third-party policy applied</text>
<text x="392" y="196.5" font-size="10.5" fill="#1f2633" text-anchor="middle">3 <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">tool_run.started</tspan> written</text>
<text x="392" y="210.2" font-size="10.5" fill="#1f2633" text-anchor="middle">4 implementation called, with a</text>
<text x="392" y="223.8" font-size="10.5" fill="#1f2633" text-anchor="middle">   time limit and an abort signal</text>
<text x="392" y="237.5" font-size="10.5" fill="#1f2633" text-anchor="middle">5 output checked against the schema</text>
<text x="392" y="251.2" font-size="10.5" fill="#1f2633" text-anchor="middle">6 <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">tool_run.finished</tspan> written</text>
<path d="M236,134 L272,134" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M236,198 L272,198" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M236,262 L272,262" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="552" y="106" width="214" height="56" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="632.1" y="125.3" font-size="11" fill="#2b3340" font-weight="700">In process</text>
<text x="659" y="139.2" font-size="10" fill="#1f2633" text-anchor="middle">code in the harness, built</text>
<text x="659" y="152.2" font-size="10" fill="#1f2633" text-anchor="middle">by a factory (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">kimina</tspan>)</text>
<rect x="552" y="170" width="214" height="56" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="630.5" y="189.3" font-size="11" fill="#2b3340" font-weight="700">MCP, stdio</text>
<text x="659" y="203.2" font-size="10" fill="#1f2633" text-anchor="middle">a program in its own process,</text>
<text x="659" y="216.2" font-size="10" fill="#1f2633" text-anchor="middle">any language; called, not linked</text>
<rect x="552" y="234" width="214" height="56" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="627.6" y="253.3" font-size="11" fill="#2b3340" font-weight="700">MCP, HTTP</text>
<text x="659" y="267.1" font-size="10" fill="#1f2633" text-anchor="middle">a server reached by url;</text>
<text x="659" y="280.1" font-size="10" fill="#1f2633" text-anchor="middle">same contract, same checks</text>
<path d="M512,134 L552,134" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)" marker-start="url(#ah-3b4456)"/>
<path d="M512,198 L552,198" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)" marker-start="url(#ah-3b4456)"/>
<path d="M512,262 L552,262" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)" marker-start="url(#ah-3b4456)"/>
<rect x="806" y="106" width="158" height="184" rx="6" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<g transform="translate(836.1,141.9) scale(0.8)" fill="none" stroke="#a87414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="10" cy="4.5" rx="7" ry="2.5"/><path d="M3 4.5v11c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-11"/><path d="M3 10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></g>
<text x="858.1" y="154.8" font-size="11.5" fill="#6b4a0c" font-weight="700">Journal, blobs</text>
<text x="885" y="169.2" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">inputHash</tspan></text>
<text x="885" y="182.9" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">outputHash</tspan></text>
<text x="885" y="196.5" font-size="10.5" fill="#1f2633" text-anchor="middle">outcome, duration</text>
<text x="885" y="210.2" font-size="10.5" fill="#1f2633" text-anchor="middle"></text>
<text x="885" y="223.8" font-size="10.5" fill="#1f2633" text-anchor="middle">inputs and outputs</text>
<text x="885" y="237.5" font-size="10.5" fill="#1f2633" text-anchor="middle">kept in <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">blobs/</tspan>,</text>
<text x="885" y="251.2" font-size="10.5" fill="#1f2633" text-anchor="middle">readable later</text>
<path d="M392,290 L392,297 Q392,304 399,304 L878,304 Q885,304 885,297 L885,290" fill="none" stroke="#a87414" stroke-width="1.4" marker-end="url(#ah-a87414)"/>
<rect x="36" y="356" width="300" height="62" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="149.2" y="377.9" font-size="11.5" fill="#2b3340" font-weight="700">Level 0: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">auto</tspan></text>
<text x="186" y="392.4" font-size="10.5" fill="#1f2633" text-anchor="middle">called by the orchestrator, by rule:</text>
<text x="186" y="406" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lean.check</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">lean.certify</tspan></text>
<rect x="350" y="356" width="300" height="62" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="456.3" y="377.9" font-size="11.5" fill="#2b3340" font-weight="700">Level 1: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">direct</tspan></text>
<text x="500" y="392.4" font-size="10.5" fill="#1f2633" text-anchor="middle">about ten tools, always declared</text>
<text x="500" y="406" font-size="10.5" fill="#1f2633" text-anchor="middle">to the model: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">compute.sage</tspan></text>
<rect x="664" y="356" width="300" height="62" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="763.4" y="377.9" font-size="11.5" fill="#2b3340" font-weight="700">Level 2: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">deferred</tspan></text>
<text x="814" y="392.4" font-size="10.5" fill="#1f2633" text-anchor="middle">found on demand, by tool search or</text>
<text x="814" y="406" font-size="10.5" fill="#1f2633" text-anchor="middle">code; installed packs are here only</text>
<rect x="36" y="442" width="216" height="88" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="78" y="470.9" font-size="11" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">harness add PATH|URL</tspan></text>
<text x="144" y="484.7" font-size="10" fill="#1f2633" text-anchor="middle">a pack is untrusted input:</text>
<text x="144" y="497.7" font-size="10" fill="#1f2633" text-anchor="middle">read and checked, never</text>
<text x="144" y="510.7" font-size="10" fill="#1f2633" text-anchor="middle">run on install</text>
<rect x="266" y="442" width="216" height="88" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="354.6" y="470.9" font-size="11" fill="#2b3340" font-weight="700">Checks</text>
<text x="374" y="484.7" font-size="10" fill="#1f2633" text-anchor="middle">MCP servers only; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">writesClaimStatus</tspan></text>
<text x="374" y="497.7" font-size="10" fill="#1f2633" text-anchor="middle">false; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">produces</tspan> at most</text>
<text x="374" y="510.7" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">computed</tspan>; a contract case each</text>
<rect x="496" y="442" width="216" height="88" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="551.2" y="470.9" font-size="11" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">--allow-programs</tspan></text>
<text x="604" y="484.7" font-size="10" fill="#1f2633" text-anchor="middle">the programs its tools would run</text>
<text x="604" y="497.7" font-size="10" fill="#1f2633" text-anchor="middle">are listed; the owner accepts</text>
<text x="604" y="510.7" font-size="10" fill="#1f2633" text-anchor="middle">them; cases validated, not run</text>
<rect x="726" y="442" width="216" height="88" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="812.3" y="470.9" font-size="11" fill="#2b3340" font-weight="700">Installed</text>
<text x="834" y="484.7" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">installed/NAME/</tspan>, recorded as</text>
<text x="834" y="497.7" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">pack.installed</tspan> in a journal</text>
<text x="834" y="510.7" font-size="10" fill="#1f2633" text-anchor="middle">of its own; hash re-checked</text>
<path d="M252,486 L266,486" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M482,486 L496,486" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M712,486 L726,486" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M877.2,442 L877.2,418" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="36" y="584" width="190" height="106" rx="6" fill="#e4f3f2" stroke="#2b7d78" stroke-width="1.4" />
<text x="114.7" y="621.1" font-size="11.5" fill="#1a4f4c" font-weight="700">Policy</text>
<text x="131" y="635.6" font-size="10.5" fill="#1f2633" text-anchor="middle">from <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--private</tspan> and the</text>
<text x="131" y="649.2" font-size="10.5" fill="#1f2633" text-anchor="middle">person's consent, set once;</text>
<text x="131" y="662.9" font-size="10.5" fill="#1f2633" text-anchor="middle">it only ever tightens</text>
<rect x="252" y="584" width="216" height="106" rx="6" fill="#e4f3f2" stroke="#2b7d78" stroke-width="1.4" />
<text x="327.9" y="615.4" font-size="11" fill="#1a4f4c" font-weight="700">1 Local form</text>
<text x="360" y="629.1" font-size="10" fill="#1f2633" text-anchor="middle">the manifest has <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">privateInput</tspan>:</text>
<text x="360" y="642.1" font-size="10" fill="#1f2633" text-anchor="middle">its fields are added to the</text>
<text x="360" y="655.1" font-size="10" fill="#1f2633" text-anchor="middle">input, whatever the caller gave</text>
<text x="360" y="668.1" font-size="10" fill="#1f2633" text-anchor="middle">(<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">lean.search</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">lit.search</tspan>)</text>
<rect x="494" y="584" width="216" height="106" rx="6" fill="#e4f3f2" stroke="#2b7d78" stroke-width="1.4" />
<text x="551.8" y="615.4" font-size="11" fill="#1a4f4c" font-weight="700">2 Non-sending only</text>
<text x="602" y="629.1" font-size="10" fill="#1f2633" text-anchor="middle">otherwise the call goes only to</text>
<text x="602" y="642.1" font-size="10" fill="#1f2633" text-anchor="middle">implementations that do not</text>
<text x="602" y="655.1" font-size="10" fill="#1f2633" text-anchor="middle">send (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">decide.ask</tspan>: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">faux</tspan>,</text>
<text x="602" y="668.1" font-size="10" fill="#1f2633" text-anchor="middle">not <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">jev</tspan>)</text>
<rect x="736" y="584" width="228" height="106" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="797.1" y="615.4" font-size="11" fill="#2b3340" font-weight="700">3 Refused: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.1">private</tspan></text>
<text x="850" y="629.1" font-size="10" fill="#1f2633" text-anchor="middle">none left: no implementation</text>
<text x="850" y="642.1" font-size="10" fill="#1f2633" text-anchor="middle">is reached; journaled as a</text>
<text x="850" y="655.1" font-size="10" fill="#1f2633" text-anchor="middle">failed tool run that names</text>
<text x="850" y="668.1" font-size="10" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">--private</tspan></text>
<path d="M226,637 L252,637" fill="none" stroke="#2b7d78" stroke-width="1.4" marker-end="url(#ah-2b7d78)"/>
<path d="M468,637 L494,637" fill="none" stroke="#2b7d78" stroke-width="1.4" marker-end="url(#ah-2b7d78)"/>
<path d="M710,637 L736,637" fill="none" stroke="#2b7d78" stroke-width="1.4" marker-end="url(#ah-2b7d78)"/>
<text x="640" y="307.7" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">every call, a refused one too</text>
<text x="801.2" y="434.7" font-size="10.5" fill="#5b6475" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">evidence, never a status</text>
</svg>
