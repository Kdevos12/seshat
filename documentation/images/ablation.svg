<text x="111.9" y="254.1" font-size="11.5" fill="#2b3340" font-weight="700">Nobody is asked</text>
<text x="146" y="268.6" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">human: none</tspan>: turns and a</text>
<text x="146" y="282.2" font-size="10.5" fill="#1f2633" text-anchor="middle">person are refused, a turn</text>
<text x="146" y="295.8" font-size="10.5" fill="#1f2633" text-anchor="middle">boundary changes what models see</text>
