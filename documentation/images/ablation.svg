<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 792" width="1000" height="792" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">Measuring a line: same problems, same dollars, paired</title>
<defs><marker id="ah-3b4456" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#3b4456"/></marker></defs>
<rect x="0" y="0" width="1000" height="792" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">Measuring a line: same problems, same dollars, paired</text>
<text x="24" y="52" font-size="12" fill="#5b6475"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">harness ablate</tspan> adds one line at a time to the ones before it, runs every arm on the same admitted problems at the same budget, and compares the arms pair by pair.</text>
<rect x="24" y="76" width="952" height="240" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(a) ONE LINE ADDED AT A TIME, EVERYTHING ELSE EQUAL</text>
<text x="964" y="94" font-size="10.5" fill="#5b6475" text-anchor="end" font-style="italic">ablate.md, &quot;The configurations and the runner&quot;</text>
<rect x="24" y="330" width="952" height="236" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="348" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(b) THE PAIRED PROTOCOL</text>
<text x="964" y="348" font-size="10.5" fill="#5b6475" text-anchor="end" font-style="italic">ablate.md, &quot;The paired protocol&quot;</text>
<rect x="24" y="580" width="952" height="174" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="598" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(c) THE YARDSTICK: A GRADED BENCH, EACH STATEMENT ADMITTED BY LEAN</text>
<text x="964" y="598" font-size="10.5" fill="#5b6475" text-anchor="end" font-style="italic">bench.md, &quot;The graded bench&quot;</text>
<rect x="36" y="104" width="220" height="120" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<g transform="translate(81.1,128.3) scale(0.8)" fill="none" stroke="#8b94a5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.8h8l4 4v12.4H4z"/><path d="M12 1.8v4h4M7 10h6M7 13h6"/></g>
<text x="103.1" y="141.3" font-size="11.5" fill="#2b3340" font-weight="700">The same problems</text>
<text x="146" y="155.7" font-size="10.5" fill="#1f2633" text-anchor="middle">a sample of the graded bench</text>
<text x="146" y="169.4" font-size="10.5" fill="#1f2633" text-anchor="middle">(c), the same seed for every arm;</text>
<text x="146" y="183" font-size="10.5" fill="#1f2633" text-anchor="middle">the same budget: providers,</text>
<text x="146" y="196.7" font-size="10.5" fill="#1f2633" text-anchor="middle">sessions, dollars per problem</text>
<rect x="36" y="236" width="220" height="68" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
