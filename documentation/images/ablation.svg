<text x="785" y="141.3" font-size="11.5" fill="#6b4a0c" font-weight="700">A journal for each arm</text>
<text x="834" y="155.7" font-size="10.5" fill="#1f2633" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">arms/NAME/measure</tspan>: an arm is</text>
<text x="834" y="169.4" font-size="10.5" fill="#1f2633" text-anchor="middle">a run of its own; every number is</text>
<text x="834" y="183" font-size="10.5" fill="#1f2633" text-anchor="middle">read from the journals, by a pure</text>
<text x="834" y="196.7" font-size="10.5" fill="#1f2633" text-anchor="middle">function of events (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">measureRun</tspan>)</text>
<path d="M678,164 L704,164" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="704" y="236" width="260" height="68" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
