<text x="834" y="275.4" font-size="10.5" fill="#1f2633" text-anchor="middle">solved, dollars per solve, context,</text>
<text x="834" y="289" font-size="10.5" fill="#1f2633" text-anchor="middle">memory use, spend by site, cache...</text>
<path d="M834,224 L834,236" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<text x="36" y="366" font-size="10.5" fill="#5b6475" font-weight="700">problem</text><text x="148" y="366" font-size="10.5" fill="#5b6475" text-anchor="middle" font-weight="700">baseline</text><text x="218" y="366" font-size="10.5" fill="#5b6475" text-anchor="middle" font-weight="700">arm</text><text x="40" y="392" font-size="10.5" fill="#1f2633">p1</text><circle cx="148" cy="387" r="6" fill="#2e7448" stroke="#2e7448" stroke-width="1.4"/><circle cx="218" cy="387" r="6" fill="#2e7448" stroke="#2e7448" stroke-width="1.4"/><rect x="32" y="400" width="250" height="22" rx="4" fill="#fbf2dd" stroke="#a87414" stroke-opacity="0.5" stroke-width="1"/><text x="40" y="416" font-size="10.5" fill="#1f2633">p2</text><circle cx="148" cy="411" r="6" fill="#ffffff" stroke="#9aa2b1" stroke-width="1.4"/><circle cx="218" cy="411" r="6" fill="#2e7448" stroke="#2e7448" stroke-width="1.4"/><text x="262" y="416" font-size="11" fill="#6b4a0c" text-anchor="middle" font-weight="700">b</text><text x="40" y="440" font-size="10.5" fill="#1f2633">p3</text><circle cx="148" cy="435" r="6" fill="#ffffff" stroke="#9aa2b1" stroke-width="1.4"/><circle cx="218" cy="435" r="6" fill="#ffffff" stroke="#9aa2b1" stroke-width="1.4"/><rect x="32" y="448" width="250" height="22" rx="4" fill="#fbf2dd" stroke="#a87414" stroke-opacity="0.5" stroke-width="1"/><text x="40" y="464" font-size="10.5" fill="#1f2633">p4</text><circle cx="148" cy="459" r="6" fill="#2e7448" stroke="#2e7448" stroke-width="1.4"/><circle cx="218" cy="459" r="6" fill="#ffffff" stroke="#9aa2b1" stroke-width="1.4"/><text x="262" y="464" font-size="11" fill="#6b4a0c" text-anchor="middle" font-weight="700">c</text><rect x="32" y="472" width="250" height="22" rx="4" fill="#fbf2dd" stroke="#a87414" stroke-opacity="0.5" stroke-width="1"/><text x="40" y="488" font-size="10.5" fill="#1f2633">p5</text><circle cx="148" cy="483" r="6" fill="#ffffff" stroke="#9aa2b1" stroke-width="1.4"/><circle cx="218" cy="483" r="6" fill="#2e7448" stroke="#2e7448" stroke-width="1.4"/><text x="262" y="488" font-size="11" fill="#6b4a0c" text-anchor="middle" font-weight="700">b</text><text x="40" y="512" font-size="10.5" fill="#1f2633">p6</text><circle cx="148" cy="507" r="6" fill="#2e7448" stroke="#2e7448" stroke-width="1.4"/><circle cx="218" cy="507" r="6" fill="#2e7448" stroke="#2e7448" stroke-width="1.4"/><text x="36" y="532" font-size="10.5" fill="#5b6475">filled: solved by Lean (illustrative); a pair is</text><text x="36" y="546" font-size="10.5" fill="#5b6475">one problem in both arms. <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">b</tspan>: only the arm</text><text x="36" y="560" font-size="10.5" fill="#5b6475">solved it; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">c</tspan>: only the baseline</text>
<rect x="300" y="358" width="330" height="98" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="310" y="384.3" font-size="11.5" fill="#2b3340" font-weight="700">Per arm</text>
<text x="310" y="398.7" font-size="10.5" fill="#1f2633">problems solved of N, with the Wilson interval (95%)</text>
<text x="310" y="412.4" font-size="10.5" fill="#1f2633">dollars spent, per solved problem, and problems</text>
<text x="310" y="426" font-size="10.5" fill="#1f2633">solved per dollar</text>
<text x="310" y="439.7" font-size="10.5" fill="#1f2633">wall-clock time; certified refutations counted apart</text>
<rect x="300" y="464" width="330" height="90" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="310" y="486.3" font-size="11.5" fill="#2b3340" font-weight="700">Against the baseline</text>
<text x="310" y="500.7" font-size="10.5" fill="#1f2633">the discordant pairs <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">b</tspan> and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">c</tspan>; the exact two-sided</text>
<text x="310" y="514.4" font-size="10.5" fill="#1f2633">McNemar test; the ratio of problems solved per dollar,</text>
<text x="310" y="528" font-size="10.5" fill="#1f2633">arm over baseline, on problems both finished. Arms that</text>
<text x="310" y="541.7" font-size="10.5" fill="#1f2633">did not finish the same problems: no verdict</text>
<text x="666" y="372" font-size="11.5" fill="#1f2633" font-weight="700">The target line</text><rect x="840" y="384" width="116" height="94" fill="#e6f2ea" stroke="#2e7448" stroke-opacity="0.5"/><line x1="782" y1="384" x2="782" y2="478" stroke="#5b6475" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="840" y1="384" x2="840" y2="478" stroke="#2e7448" stroke-width="2"/><line x1="666" y1="478" x2="956" y2="478" stroke="#9aa2b1" stroke-width="1.3"/><line x1="666" y1="478" x2="666" y2="482" stroke="#9aa2b1" stroke-width="1.3"/><text x="666" y="494" font-size="10.5" fill="#5b6475" text-anchor="middle">0</text><line x1="782" y1="478" x2="782" y2="482" stroke="#9aa2b1" stroke-width="1.3"/><text x="782" y="494" font-size="10.5" fill="#5b6475" text-anchor="middle">1</text><line x1="898" y1="478" x2="898" y2="482" stroke="#9aa2b1" stroke-width="1.3"/><text x="898" y="494" font-size="10.5" fill="#5b6475" text-anchor="middle">2</text><text x="777" y="398" font-size="10.5" fill="#5b6475" text-anchor="end">baseline</text><text x="846" y="398" font-size="10.5" fill="#1d4a2e"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--target</tspan> 1.5</text><circle cx="880.6" cy="430" r="6" fill="#2e7448"/><text x="880.6" y="452" font-size="10.5" fill="#1d4a2e" text-anchor="middle">an arm</text><text x="666" y="512" font-size="10.5" fill="#5b6475">problems solved per dollar, arm over baseline (illustrative)</text>
<rect x="36" y="608" width="300" height="62" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="152.8" y="629.9" font-size="11.5" fill="#2b3340" font-weight="700">A: exercises</text>
<text x="186" y="644.4" font-size="10.5" fill="#1f2633" text-anchor="middle">formal-conjectures <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">textbook</tspan> and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">test</tspan></text>
<text x="186" y="658" font-size="10.5" fill="#1f2633" text-anchor="middle">theorems; admitted: 111 of 111</text>
<rect x="350" y="608" width="300" height="62" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="461.4" y="629.9" font-size="11.5" fill="#2b3340" font-weight="700">B: competition</text>
<text x="500" y="644.4" font-size="10.5" fill="#1f2633" text-anchor="middle">PutnamBench, a seeded sample of 100;</text>
<text x="500" y="658" font-size="10.5" fill="#1f2633" text-anchor="middle">admitted: 20 of 326 candidates</text>
<rect x="664" y="608" width="300" height="62" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="782.5" y="629.9" font-size="11.5" fill="#2b3340" font-weight="700">C: research</text>
<text x="814" y="644.4" font-size="10.5" fill="#1f2633" text-anchor="middle">formal-conjectures with a formal proof</text>
<text x="814" y="658" font-size="10.5" fill="#1f2633" text-anchor="middle">elsewhere, up to 70; admitted: 10 of 70</text>
<rect x="36" y="690" width="928" height="52" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="2.4" />
<g transform="translate(415.5,694) scale(0.8)" fill="none" stroke="#2e7448" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1.5 L17.5 4.5 V10 C17.5 14.5 14 17.5 10 18.8 C6 17.5 2.5 14.5 2.5 10 V4.5 Z"/><path d="M6.5 10.2 L9 12.7 L13.8 7.6"/></g>
<text x="437.5" y="706.9" font-size="11.5" fill="#1d4a2e" font-weight="700">Admission by the real Lean</text>
<text x="500" y="721.4" font-size="10.5" fill="#1f2633" text-anchor="middle">a statement is admitted only if it compiles with <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">sorry</tspan> as its proof; one Lean cannot read is replaced, never counted as unsolved;</text>
<text x="500" y="735" font-size="10.5" fill="#1f2633" text-anchor="middle">problems tagged <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">small_budget_out_of_reach</tspan> are reported apart, and the verdicts use the problems in reach</text>
<path d="M186,670 L186,690" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M500,670 L500,690" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M814,670 L814,690" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<text x="292" y="308" font-size="10.5" fill="#5b6475">cumulative: each arm holds the lines of the arms above it</text>
<text x="666" y="530" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">Target met</tspan>: the best arm's ratio reaches the</text>
<text x="666" y="543.6" font-size="10.5" fill="#1f2633">target and it solves no fewer problems than</text>
<text x="666" y="557.3" font-size="10.5" fill="#1f2633">the baseline; otherwise <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">Target not met</tspan></text>
<rect x="24" y="763" width="22" height="14" rx="3" fill="#ffffff" stroke="#4a5567" stroke-width="1.4" />
<text x="52" y="774" font-size="10.5" fill="#5b6475">has run for real (Lean 4.27, a real model)</text>
<rect x="540" y="763" width="22" height="14" rx="3" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="568" y="774" font-size="10.5" fill="#5b6475">protocol</text>
<rect x="631.3" y="763" width="22" height="14" rx="3" fill="#fbf2dd" stroke="#a87414" stroke-width="1.4" />
<text x="659.3" y="774" font-size="10.5" fill="#5b6475">journals</text>
