<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">The escalation ladder: dearer ideas only for stuck problems</title>
<defs><marker id="ah-2e7448" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#2e7448"/></marker><marker id="ah-3b4456" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 L2.6,5 z" fill="#3b4456"/></marker></defs>
<rect x="0" y="0" width="1000" height="672" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">The escalation ladder: dearer ideas only for stuck problems</text>
<text x="24" y="52" font-size="12" fill="#5b6475">A problem moves up a rung when it has spent a share of its budget without Lean progress; problems the cheap stack solves never pay for the rungs above.</text>
<rect x="24" y="76" width="952" height="124" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">WHEN A PROBLEM MOVES UP</text>
<text x="964" y="94" font-size="10.5" fill="#5b6475" text-anchor="end" font-style="italic">scheduler.md, &quot;The escalation ladder&quot;</text>
<rect x="36" y="214" width="292" height="354" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="48" y="232" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">RUNG 0: FROM THE START</text>
<rect x="352" y="214" width="292" height="354" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="364" y="232" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">RUNG 1: VARIANTS</text>
<rect x="668" y="214" width="292" height="354" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="680" y="232" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">RUNG 2: ALTERNATIVES</text>
<path d="M0,0 L0.1,0" fill="none" stroke="#2e7448" stroke-width="1.4"/>
<rect x="46" y="244" width="272" height="84" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" />
<g transform="translate(150,257.2) scale(0.8)" fill="none" stroke="#6a4c9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 C8.8 6.6 10.4 8.2 15 9 C10.4 9.8 8.8 11.4 8 16 C7.2 11.4 5.6 9.8 1 9 C5.6 8.2 7.2 6.6 8 2 Z"/><path d="M15.5 12.5 C15.8 14.2 16.3 14.7 18 15 C16.3 15.3 15.8 15.8 15.5 17.5 C15.2 15.8 14.7 15.3 13 15 C14.7 14.7 15.2 14.2 15.5 12.5 Z"/></g>
<text x="172" y="270.1" font-size="11.5" fill="#45306a" font-weight="700">Provers</text>
<text x="182" y="284.6" font-size="10.5" fill="#1f2633" text-anchor="middle">independent provers, in fresh</text>
<text x="182" y="298.2" font-size="10.5" fill="#1f2633" text-anchor="middle">sessions, on a Lean sketch of the</text>
<text x="182" y="311.8" font-size="10.5" fill="#1f2633" text-anchor="middle">target</text>
<rect x="46" y="338" width="272" height="100" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="113.9" y="365.3" font-size="11.5" fill="#2b3340" font-weight="700">Lines with no higher rung</text>
<text x="182" y="379.7" font-size="10.5" fill="#1f2633" text-anchor="middle">M1 shared claims, M10 the classical</text>
<text x="182" y="393.4" font-size="10.5" fill="#1f2633" text-anchor="middle">battery, M12 holes and blueprints;</text>
<text x="182" y="407" font-size="10.5" fill="#1f2633" text-anchor="middle">M12 owns the ladder and the</text>
<text x="182" y="420.7" font-size="10.5" fill="#1f2633" text-anchor="middle">measure of progress</text>
<rect x="46" y="448" width="272" height="110" rx="6" fill="#ffffff" stroke="#8b94a5" stroke-width="1.4" />
<text x="93.2" y="480.3" font-size="11.5" fill="#2b3340" font-weight="700">A rung counts only if its line is on</text>
<text x="182" y="494.7" font-size="10.5" fill="#1f2633" text-anchor="middle">a line above the problem's rung is</text>
<text x="182" y="508.4" font-size="10.5" fill="#1f2633" text-anchor="middle">idle: it gets no hook, briefing or tool</text>
<text x="182" y="522" font-size="10.5" fill="#1f2633" text-anchor="middle">until <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">ladder.escalated</tspan> moves the</text>
<text x="182" y="535.7" font-size="10.5" fill="#1f2633" text-anchor="middle">problem up</text>
<rect x="362" y="244" width="272" height="176" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" stroke-dasharray="5 3"/>
<g transform="translate(372,262.2) scale(0.8)" fill="none" stroke="#6a4c9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 C8.8 6.6 10.4 8.2 15 9 C10.4 9.8 8.8 11.4 8 16 C7.2 11.4 5.6 9.8 1 9 C5.6 8.2 7.2 6.6 8 2 Z"/><path d="M15.5 12.5 C15.8 14.2 16.3 14.7 18 15 C16.3 15.3 15.8 15.8 15.5 17.5 C15.2 15.8 14.7 15.3 13 15 C14.7 14.7 15.2 14.2 15.5 12.5 Z"/></g>
<text x="394" y="275.2" font-size="11.5" fill="#45306a" font-weight="700">M18: a curriculum of variants</text>
<text x="372" y="289.6" font-size="10.5" fill="#1f2633"><tspan font-weight="700">1</tspan> one model request: at most 4 easier</text>
<text x="372" y="303.3" font-size="10.5" fill="#1f2633">variants: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">small_case</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">prime_case</tspan>,</text>
<text x="372" y="316.9" font-size="10.5" fill="#1f2633"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">extra_hypothesis</tspan></text>
<text x="372" y="330.5" font-size="10.5" fill="#1f2633"><tspan font-weight="700">2</tspan> each is a claim, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">special_case_of</tspan> the</text>
<text x="372" y="344.2" font-size="10.5" fill="#1f2633">target, with a <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">prove</tspan> task</text>
<text x="372" y="357.8" font-size="10.5" fill="#1f2633"><tspan font-weight="700">3</tspan> inner sessions of one model call; the</text>
<text x="372" y="371.5" font-size="10.5" fill="#1f2633">proof goes through <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">validate</tspan></text>
<text x="372" y="385.1" font-size="10.5" fill="#1f2633"><tspan font-weight="700">4</tspan> what Lean accepted reaches the briefings:</text>
<text x="372" y="398.8" font-size="10.5" fill="#1f2633">&quot;Special cases already proved&quot;</text>
<rect x="362" y="430" width="272" height="62" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="455.3" y="451.9" font-size="11.5" fill="#2b3340" font-weight="700">A capped share</text>
<text x="498" y="466.4" font-size="10.5" fill="#1f2633" text-anchor="middle">at most <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">share</tspan> = 0.2 of the problem's</text>
<text x="498" y="480" font-size="10.5" fill="#1f2633" text-anchor="middle">budget; spent, the open variants fail</text>
<rect x="362" y="502" width="272" height="56" rx="6" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="434" y="520.9" font-size="11.5" fill="#1d4a2e" font-weight="700">The target is untouched</text>
<text x="498" y="535.4" font-size="10.5" fill="#1f2633" text-anchor="middle">a variant is a claim of its own; no</text>
<text x="498" y="549" font-size="10.5" fill="#1f2633" text-anchor="middle">proof of it changes the target's status</text>
<rect x="678" y="244" width="272" height="150" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" stroke-dasharray="5 3"/>
<g transform="translate(688,269.7) scale(0.8)" fill="none" stroke="#6a4c9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="15" r="2.3"/><circle cx="16" cy="15" r="2.3"/><circle cx="10" cy="4.5" r="2.3"/><path d="M5.2 13l3.6-6.4M14.8 13l-3.6-6.4M6.3 15h7.4"/></g>
<text x="710" y="282.6" font-size="11.5" fill="#45306a" font-weight="700">M15: an archive of decompositions</text>
<text x="688" y="297.1" font-size="10.5" fill="#1f2633">several checked decompositions kept alive:</text>
<text x="688" y="310.7" font-size="10.5" fill="#1f2633">one elite per cell <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">depth|family|region</tspan>,</text>
<text x="688" y="324.4" font-size="10.5" fill="#1f2633">ranked by the share of closed leaves;</text>
<text x="688" y="338" font-size="10.5" fill="#1f2633">Thompson sampling picks the cell a session</text>
<text x="688" y="351.7" font-size="10.5" fill="#1f2633">extends, or a fresh arm; proofs that closed</text>
<text x="688" y="365.3" font-size="10.5" fill="#1f2633">elsewhere are offered as schemas</text>
<rect x="678" y="404" width="272" height="154" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" stroke-dasharray="5 3"/>
<g transform="translate(688,431.7) scale(0.8)" fill="none" stroke="#6a4c9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="10" height="10" rx="1.5"/><rect x="8" y="8" width="4" height="4"/><path d="M8 2v3M12 2v3M8 15v3M12 15v3M2 8h3M2 12h3M15 8h3M15 12h3"/></g>
<text x="710" y="444.6" font-size="11.5" fill="#45306a" font-weight="700">M16: program search</text>
<text x="688" y="459.1" font-size="10.5" fill="#1f2633">for a subgoal with a computable score, a</text>
<text x="688" y="472.7" font-size="10.5" fill="#1f2633">model writes programs, kept in islands and</text>
<text x="688" y="486.4" font-size="10.5" fill="#1f2633">scored in a sandbox; the score only guides</text>
<text x="688" y="500" font-size="10.5" fill="#1f2633">the search. The best program's witness is</text>
<text x="688" y="513.7" font-size="10.5" fill="#1f2633">written as a Lean term, screened, and</text>
<text x="688" y="527.3" font-size="10.5" fill="#1f2633">submitted through <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">validate</tspan></text>
<path d="M328,391 L352,391" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<path d="M644,391 L668,391" fill="none" stroke="#3b4456" stroke-width="1.4" marker-end="url(#ah-3b4456)"/>
<rect x="36" y="582" width="924" height="36" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<g transform="translate(280,591.7) scale(0.8)" fill="none" stroke="#4a5567" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8"/><path d="M12.6 7.2c-.5-.9-1.5-1.4-2.6-1.4-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2c1.6.3 2.7.9 2.7 2.1s-1.2 2-2.7 2c-1.2 0-2.2-.5-2.7-1.4M10 4.2v1.6M10 14v1.8"/></g>
<text x="302" y="604.6" font-size="11.5" fill="#2b3340" font-weight="700">One problem budget pays for every rung; the report lists the dollars per rung.</text>
<rect x="36" y="128" width="277.2" height="30" fill="#4a5567" fill-opacity="0.1" stroke="#4a5567" stroke-width="1.2"/><text x="174.6" y="147" font-size="11" fill="#2b3340" text-anchor="middle" font-weight="700">rung 0: provers and the lines on from the start</text><rect x="313.2" y="128" width="277.2" height="30" fill="#4a5567" fill-opacity="0.22" stroke="#4a5567" stroke-width="1.2"/><text x="451.8" y="147" font-size="11" fill="#2b3340" text-anchor="middle" font-weight="700">rung 1: M18</text><rect x="590.4" y="128" width="369.6" height="30" fill="#4a5567" fill-opacity="0.36" stroke="#4a5567" stroke-width="1.2"/><text x="775.2" y="147" font-size="11" fill="#2b3340" text-anchor="middle" font-weight="700">rung 2: M15, M16</text><path d="M946,128 V114 H50 V125" fill="none" stroke="#2e7448" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-2e7448)"/><text x="498" y="117" font-size="10.5" fill="#1d4a2e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Lean progress (a new accepted subclaim, or fewer open holes) restarts the count</text><line x1="313.2" y1="158" x2="313.2" y2="170" stroke="#1f2633" stroke-width="1.4"/><line x1="590.4" y1="158" x2="590.4" y2="170" stroke="#1f2633" stroke-width="1.4"/><text x="313.2" y="184" font-size="10.5" fill="#1f2633" text-anchor="middle">30% of the problem's budget spent since the last Lean progress</text><text x="313.2" y="198" font-size="10.5" fill="#5b6475" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">ladder.escalated</tspan>, rung 0 to 1</text><text x="590.4" y="184" font-size="10.5" fill="#1f2633" text-anchor="middle">60%: rung 1 to 2</text><text x="590.4" y="198" font-size="10.5" fill="#5b6475" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">fractions</tspan>, default 0.3 and 0.6</text>
<rect x="24" y="637" width="22" height="14" rx="3" fill="#ffffff" stroke="#4a5567" stroke-width="1.4" />
<text x="52" y="648" font-size="10.5" fill="#5b6475">has run for real (Lean 4.27, a real model)</text>
<rect x="268.8" y="637" width="22" height="14" rx="3" fill="#ffffff" stroke="#4a5567" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="296.8" y="648" font-size="10.5" fill="#5b6475">built, tested with simulations only</text>
<rect x="480" y="637" width="22" height="14" rx="3" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" />
<text x="508" y="648" font-size="10.5" fill="#5b6475">a model</text>
<rect x="571.3" y="637" width="22" height="14" rx="3" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="599.3" y="648" font-size="10.5" fill="#5b6475">budget, scheduling</text>
<rect x="713.5" y="637" width="22" height="14" rx="3" fill="#e6f2ea" stroke="#2e7448" stroke-width="1.4" />
<text x="741.5" y="648" font-size="10.5" fill="#5b6475">Lean</text>
</svg>
