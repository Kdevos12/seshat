<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 724" width="1000" height="724" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">Runs: two axes of shape, seven nested words</title>
<defs></defs>
<rect x="0" y="0" width="1000" height="724" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#1f2633" font-weight="700">Runs: two axes of shape, seven nested words</text>
<text x="24" y="52" font-size="12" fill="#5b6475">A run is shaped by how long it goes (horizon) and whether it waits for a person (human); inside it, the same seven words name every level of work.</text>
<rect x="24" y="76" width="952" height="256" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="94" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(a) THE TWO AXES: WHICH COMMAND MAKES WHICH RUN</text>
<text x="964" y="94" font-size="10.5" fill="#5b6475" text-anchor="end" font-style="italic">runs.md, &quot;The two axes&quot;</text>
<rect x="24" y="346" width="952" height="312" rx="10" fill="#f7f8fa" stroke="#d5dae2" stroke-opacity="1" stroke-width="1.2"/>
<text x="36" y="364" font-size="10.5" fill="#5b6475" font-weight="700" letter-spacing="0.8">(b) THE WORDS, EACH LEVEL INSIDE THE ONE ABOVE</text>
<text x="964" y="364" font-size="10.5" fill="#5b6475" text-anchor="end" font-style="italic">runs.md, &quot;The levels&quot;</text>
<rect x="156" y="104" width="258" height="30" rx="6" fill="#fae8ee" stroke="#ad4468" stroke-width="1.4" />
<text x="223.8" y="123.6" font-size="11.5" fill="#6e2540" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">none</tspan>: nobody is asked</text>
<rect x="430" y="104" width="258" height="30" rx="6" fill="#fae8ee" stroke="#ad4468" stroke-width="1.4" />
<text x="473" y="123.6" font-size="11.5" fill="#6e2540" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">consortium</tspan>: waits for the team</text>
<rect x="704" y="104" width="258" height="30" rx="6" fill="#fae8ee" stroke="#ad4468" stroke-width="1.4" />
<text x="754.7" y="123.6" font-size="11.5" fill="#6e2540" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">digest</tspan>: the next turn follows</text>
<rect x="36" y="142" width="108" height="88" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="65.8" y="170.1" font-size="11.5" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">episode</tspan></text>
<text x="90" y="184.5" font-size="10.5" fill="#1f2633" text-anchor="middle">a bounded number</text>
<text x="90" y="198.2" font-size="10.5" fill="#1f2633" text-anchor="middle">of sessions; it ends</text>
<text x="90" y="211.8" font-size="10.5" fill="#1f2633" text-anchor="middle">when they are used</text>
<rect x="36" y="238" width="108" height="88" rx="6" fill="#eceff3" stroke="#4a5567" stroke-width="1.4" />
<text x="62.4" y="259.3" font-size="11.5" fill="#2b3340" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">campaign</tspan></text>
<text x="90" y="273.7" font-size="10.5" fill="#1f2633" text-anchor="middle">money, time and a</text>
<text x="90" y="287.4" font-size="10.5" fill="#1f2633" text-anchor="middle">verified frontier</text>
<text x="90" y="301" font-size="10.5" fill="#1f2633" text-anchor="middle">bound it; no</text>
<text x="90" y="314.7" font-size="10.5" fill="#1f2633" text-anchor="middle">session cap</text>
<rect x="156" y="142" width="258" height="88" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" />
<text x="247.1" y="163.3" font-size="11.5" fill="#45306a" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">harness run</tspan></text>
<text x="285" y="177.7" font-size="10.5" fill="#1f2633" text-anchor="middle">no turn limit: nobody is asked;</text>
<text x="285" y="191.4" font-size="10.5" fill="#1f2633" text-anchor="middle">each arm of <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">harness ablate</tspan></text>
<text x="285" y="205" font-size="10.5" fill="#1f2633" text-anchor="middle">(a turn boundary would change</text>
<text x="285" y="218.7" font-size="10.5" fill="#1f2633" text-anchor="middle">what the models see)</text>
<rect x="430" y="142" width="258" height="88" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" />
<text x="514.1" y="170.1" font-size="11.5" fill="#45306a" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">harness solve</tspan></text>
<text x="559" y="184.5" font-size="10.5" fill="#1f2633" text-anchor="middle">or <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">harness run</tspan> with a turn limit</text>
<text x="559" y="198.2" font-size="10.5" fill="#1f2633" text-anchor="middle">or <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--human</tspan>: a turn ends at a limit</text>
<text x="559" y="211.8" font-size="10.5" fill="#1f2633" text-anchor="middle">or a breakpoint and waits</text>
<rect x="704" y="142" width="258" height="88" rx="6" fill="#f6f7f9" stroke="#9aa2b1" stroke-width="1.4" stroke-dasharray="1.5 3"/>
<text x="782.2" y="170.1" font-size="11.5" fill="#5b6475" font-weight="700">refused at the start</text>
<text x="833" y="184.5" font-size="10.5" fill="#5b6475" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">digest</tspan> goes with <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">campaign</tspan>:</text>
<text x="833" y="198.2" font-size="10.5" fill="#5b6475" text-anchor="middle">a run that never waits</text>
<text x="833" y="211.8" font-size="10.5" fill="#5b6475" text-anchor="middle">for a person is a campaign</text>
<rect x="156" y="238" width="258" height="88" rx="6" fill="#f6f7f9" stroke="#9aa2b1" stroke-width="1.4" stroke-dasharray="1.5 3"/>
<text x="234.2" y="272.9" font-size="11.5" fill="#5b6475" font-weight="700">refused at the start</text>
<text x="285" y="287.4" font-size="10.5" fill="#5b6475" text-anchor="middle">a campaign works in turns:</text>
<text x="285" y="301" font-size="10.5" fill="#5b6475" text-anchor="middle">give <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">digest</tspan> or <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">consortium</tspan></text>
<rect x="430" y="238" width="258" height="88" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="476.2" y="266.1" font-size="11.5" fill="#45306a" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">harness campaign --human</tspan></text>
<text x="559" y="280.6" font-size="10.5" fill="#1f2633" text-anchor="middle">turns wait for the team, as in a</text>
<text x="559" y="294.2" font-size="10.5" fill="#1f2633" text-anchor="middle">consortium run; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">harness resume</tspan></text>
<text x="559" y="307.8" font-size="10.5" fill="#1f2633" text-anchor="middle">continues it</text>
<rect x="704" y="238" width="258" height="88" rx="6" fill="#efe9f7" stroke="#6a4c9c" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="777.8" y="266.1" font-size="11.5" fill="#45306a" font-weight="700"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.6">harness campaign</tspan></text>
<text x="833" y="280.6" font-size="10.5" fill="#1f2633" text-anchor="middle">turns follow each other alone;</text>
<text x="833" y="294.2" font-size="10.5" fill="#1f2633" text-anchor="middle">what a person would be asked</text>
<text x="833" y="307.8" font-size="10.5" fill="#1f2633" text-anchor="middle">goes into the digest</text>
<rect x="36" y="374" width="928" height="272" rx="7" fill="#ffffff" stroke="#4a5567" stroke-width="1.3"/><text x="48" y="393" font-size="10.5" fill="#1f2633"><tspan font-weight="700">series</tspan>   runs chained by <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--memory-from</tspan>, a consolidation pass between them</text><text x="952" y="393" font-size="10.5" fill="#5b6475" text-anchor="end">bounded by the person</text><rect x="58" y="405" width="884" height="235" rx="7" fill="#eceff3" stroke="#a87414" stroke-width="2.4"/><text x="70" y="424" font-size="10.5" fill="#1f2633"><tspan font-weight="700">run</tspan>   one directory, one journal, one configuration: the unit of replay</text><text x="930" y="424" font-size="10.5" fill="#5b6475" text-anchor="end">its allowance: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--run-budget-usd</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--max-usd</tspan></text><rect x="80" y="436" width="840" height="198" rx="7" fill="#ffffff" stroke="#4a5567" stroke-width="1.3"/><text x="92" y="455" font-size="10.5" fill="#1f2633"><tspan font-weight="700">turn</tspan>   the work between two stops: a limit or breakpoint, a crash, a usage limit</text><text x="908" y="455" font-size="10.5" fill="#5b6475" text-anchor="end"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--turn-usd</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--turn-tokens</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--turn-minutes</tspan></text><rect x="102" y="467" width="796" height="161" rx="7" fill="#eceff3" stroke="#4a5567" stroke-width="1.3"/><text x="114" y="486" font-size="10.5" fill="#1f2633"><tspan font-weight="700">problem</tspan>   one target claim inside a run</text><text x="886" y="486" font-size="10.5" fill="#5b6475" text-anchor="end">its share: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--budget-usd</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">budgetShare</tspan></text><rect x="124" y="498" width="752" height="124" rx="7" fill="#ffffff" stroke="#4a5567" stroke-width="1.3"/><text x="136" y="517" font-size="10.5" fill="#1f2633"><tspan font-weight="700">child</tspan>   a delegated piece of work: a probe, a prover task, a hole session, a planner round</text><text x="864" y="517" font-size="10.5" fill="#5b6475" text-anchor="end">a ledger carved from its parent</text><rect x="146" y="529" width="708" height="87" rx="7" fill="#eceff3" stroke="#4a5567" stroke-width="1.3"/><text x="158" y="548" font-size="10.5" fill="#1f2633"><tspan font-weight="700">session</tspan>   one fresh model context</text><text x="842" y="548" font-size="10.5" fill="#5b6475" text-anchor="end"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--sessions</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--context-tokens</tspan></text><rect x="168" y="560" width="664" height="50" rx="7" fill="#ffffff" stroke="#4a5567" stroke-width="1.3"/><text x="180" y="579" font-size="10.5" fill="#1f2633"><tspan font-weight="700">step</tspan>   one model response</text><text x="820" y="579" font-size="10.5" fill="#5b6475" text-anchor="end"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.7">--steps</tspan></text>
<text x="36" y="124" font-size="10.5" fill="#5b6475" font-weight="700">horizon / human</text>
<text x="36" y="678" font-size="10.5" fill="#5b6475">Only the run has a journal (gold border): a child has none of its own and writes to the journal of the run that started it, so the truth of a run is one chain.</text>
<rect x="24" y="697" width="22" height="14" rx="3" fill="#ffffff" stroke="#4a5567" stroke-width="1.4" />
<text x="52" y="708" font-size="10.5" fill="#5b6475">has run for real</text>
<rect x="148.6" y="697" width="22" height="14" rx="3" fill="#ffffff" stroke="#4a5567" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="176.6" y="708" font-size="10.5" fill="#5b6475">built, tested with simulations only</text>
<rect x="355.5" y="697" width="22" height="14" rx="3" fill="#f6f7f9" stroke="#9aa2b1" stroke-width="1.4" stroke-dasharray="1.5 3"/>
<text x="383.5" y="708" font-size="10.5" fill="#5b6475">a combination the start refuses</text>
</svg>
